<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Sponza Axion test</title>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: rgb(7, 10, 16);
                font: 12px sans-serif;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            #msg {
                position: fixed;
                left: 50px;
                top: 12px;
                color: rgb(206, 216, 228);
                font-size: 13px;
                text-shadow: 0 1px 2px rgb(0, 0, 0);
                pointer-events: none;
            }

            #tab {
                position: fixed;
                left: 10px;
                top: 8px;
                width: 30px;
                height: 26px;
                z-index: 3;
                padding: 0;
                border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 6px;
                background: rgba(14, 18, 27, 0.86);
                color: rgb(206, 216, 228);
                font-size: 16px;
                line-height: 24px;
                cursor: pointer;
            }

            #tab:hover {
                background: rgba(41, 51, 69, 0.95);
            }

            /* Sliding menu */
            #panel {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 250px;
                z-index: 2;
                background: rgba(10, 13, 20, 0.93);
                color: rgb(206, 216, 228);
                border-right: 1px solid rgba(255, 255, 255, 0.11);
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }

            #panel.open {
                transform: translateX(0);
            }

            #list {
                position: absolute;
                inset: 0;
                padding: 44px 20px 14px 14px;
                overflow-y: auto;
                scrollbar-width: none;
            }

            #list::-webkit-scrollbar {
                display: none;
            }

            #list h3 {
                margin: 14px 0 6px;
                font-size: 11px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: rgb(127, 143, 164);
            }

            .row {
                margin: 7px 0;
            }

            .row label {
                display: flex;
                justify-content: space-between;
                margin-bottom: 2px;
            }

            .row label span {
                color: rgb(143, 178, 254);
            }

            .row input[type=range] {
                width: 100%;
                margin: 0;
            }

            .check {
                display: flex;
                align-items: center;
                gap: 6px;
                margin: 7px 0;
                cursor: pointer;
            }

            .btn {
                width: 100%;
                margin-top: 8px;
                padding: 6px;
                border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 5px;
                background: rgb(27, 34, 49);
                color: rgb(206, 216, 228);
                cursor: pointer;
            }

            .btn:hover {
                background: rgb(38, 48, 67);
            }

            /* Custom scroll bar: thin pixel strip, wider while scrolling or hovered */
            #bar {
                position: absolute;
                right: 2px;
                top: 40px;
                bottom: 6px;
                width: 14px;
            }

            #thumb {
                position: absolute;
                right: 0;
                width: 3px;
                min-height: 24px;
                border-radius: 1px;
                background-color: rgb(96, 113, 139);
                background-image:
                    linear-gradient(90deg, rgba(0, 0, 0, 0.27) 50%, transparent 50%),
                    linear-gradient(rgba(255, 255, 255, 0.13) 50%, transparent 50%);
                background-size: 2px 2px, 4px 4px;
                image-rendering: pixelated;
                transition: width 0.18s ease, background-color 0.18s ease;
                cursor: pointer;
            }

            #bar:hover #thumb,
            #bar.active #thumb {
                width: 9px;
                background-color: rgb(131, 152, 187);
            }

            #bar.hide {
                display: none;
            }

            /* Collapsible sections */
            .sec {
                border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            }

            .sec-head {
                display: block;
                width: 100%;
                padding: 9px 2px;
                border: 0;
                background: none;
                color: rgb(171, 186, 207);
                font: 11px sans-serif;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                text-align: left;
                cursor: pointer;
            }

            .sec-head:hover {
                color: rgb(222, 231, 243);
            }

            .arrow {
                display: inline-block;
                width: 14px;
                transition: transform 0.15s ease;
            }

            .sec.open .arrow {
                transform: rotate(90deg);
            }

            .sec-body {
                display: none;
                padding: 0 2px 10px;
            }

            .sec.open .sec-body {
                display: block;
            }

            select {
                width: 100%;
                padding: 3px;
                border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 4px;
                background: rgb(21, 27, 39);
                color: rgb(206, 216, 228);
            }

            .reset {
                margin-top: 14px;
            }
        </style>
    </head>
    <body>
        <canvas id="c"></canvas>
        <div id="msg">loading…</div>
        <button id="tab" title="Visual settings">&#9776;</button>
        <div id="panel">
            <div id="list"></div>
            <div id="bar"><div id="thumb"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/gh/SwankyMan88/Axion@v0.6.0/dist/axion.min.js"></script><!-- My 3D engine Axion -->
        <script src="https://cdn.jsdelivr.net/gh/SwankyMan88/Axion@v0.6.0/assets/sponza.js"></script><!-- The Sponza test in JS form -->

        <!-- Shared state: every script below reads and writes through window.sz -->
        <script type="module">
            var sz = window.sz = {};

            sz.msg = document.getElementById("msg");
            sz.canvas = document.getElementById("c");
            sz.panel = document.getElementById("panel");
            sz.list = document.getElementById("list");

            sz.app = null;
            sz.ready = false;

            // Camera / player. x, y, z is the eye in fly mode and the feet in walk mode.
            sz.cam = {
                mode: "walk",
                x: 9.2,
                y: 1.7,
                z: -0.3,
                yaw: Math.PI / 2,
                pitch: 0.02,
                vx: 0,
                vy: 0,
                vz: 0,
                eye: 1.6,
                eyeY: 1.7,
                ground: false,
                flySpeed: 4,
                walkSpeed: 3.2,
                sens: 1,
                keys: {},
                jumpHeld: false,
                locked: false,
                drag: false
            };

            sz.hint = function () {
                if (!sz.ready) {
                    return;
                }
                var how = sz.cam.mode === "walk"
                    ? "WASD walk · Space jump · Shift run"
                    : "WASD fly · Space / Shift up and down";
                if (sz.cam.locked) {
                    sz.msg.textContent = how + " · Esc to release the mouse";
                } else {
                    sz.msg.textContent = "Click to look around · " + how;
                }
            };
        </script>

        <!-- Input: keyboard, mouse lock and drag-to-look -->
        <script type="module">
            var sz = window.sz;
            var cam = sz.cam;

            window.addEventListener("keydown", function (e) {
                cam.keys[e.code] = true;
                if (e.code === "Space") {
                    e.preventDefault();
                }
            });

            window.addEventListener("keyup", function (e) {
                cam.keys[e.code] = false;
            });

            window.addEventListener("blur", function () {
                cam.keys = {};
            });

            sz.canvas.addEventListener("mousedown", function (e) {
                if (e.button !== 0) {
                    return;
                }
                sz.panel.classList.remove("open");

                // Drag-to-look stays on in case the page won't allow a lock
                cam.drag = true;

                var canvas = sz.canvas;
                var req = canvas.requestPointerLock ? canvas.requestPointerLock() : null;
                if (req && req.catch) {
                    req.catch(function () {});
                }
            });

            window.addEventListener("mouseup", function () {
                cam.drag = false;
            });

            document.addEventListener("pointerlockchange", function () {
                cam.locked = document.pointerLockElement === sz.canvas;
                sz.hint();
            });

            window.addEventListener("mousemove", function (e) {
                if (!cam.locked && !cam.drag) {
                    return;
                }
                var k = 0.0024 * cam.sens;
                cam.yaw -= e.movementX * k;
                cam.pitch -= e.movementY * k;
                cam.pitch = Math.max(-1.55, Math.min(1.55, cam.pitch));
            });
        </script>

        <!-- Collision and physics: triangle grid, ground checks, wall push-out -->
        <script type="module">
            var sz = window.sz;

            var phys = sz.phys = {
                ready: false,
                cell: 1,
                tris: null,      // 9 floats per triangle
                box: null,       // min xyz, max xyz per triangle
                up: null,        // normal y (absolute) per triangle
                grid: new Map(),
                stamp: null,
                mark: 0,
                found: [],
                gravity: 18,
                jump: 5.2,
                step: 0.45,
                radius: 0.3,
                spheres: [0.65, 1.05, 1.45]
            };

            function key(ix, iz) {
                return (ix + 2048) * 4096 + (iz + 2048);
            }

            // Build from Axion's parsed glTF primitives (world-space vertices)
            phys.build = function (prims) {
                var count = 0;
                for (var i = 0; i < prims.length; i++) {
                    count += prims[i].geometry.indices.length / 3;
                }

                var tris = new Float32Array(count * 9);
                var box = new Float32Array(count * 6);
                var up = new Float32Array(count);
                var n = 0;

                for (var p = 0; p < prims.length; p++) {
                    var g = prims[p].geometry;
                    var v = g.vertices;
                    var idx = g.indices;

                    for (var t = 0; t < idx.length; t += 3) {
                        var o = n * 9;
                        for (var c = 0; c < 3; c++) {
                            var src = idx[t + c] * 8;
                            tris[o + c * 3] = v[src];
                            tris[o + c * 3 + 1] = v[src + 1];
                            tris[o + c * 3 + 2] = v[src + 2];
                        }

                        var ax = tris[o], ay = tris[o + 1], az = tris[o + 2];
                        var bx = tris[o + 3], by = tris[o + 4], bz = tris[o + 5];
                        var cx = tris[o + 6], cy = tris[o + 7], cz = tris[o + 8];

                        // Normal, to tell floors from walls
                        var ux = bx - ax, uy = by - ay, uz = bz - az;
                        var wx = cx - ax, wy = cy - ay, wz = cz - az;
                        var nx = uy * wz - uz * wy;
                        var ny = uz * wx - ux * wz;
                        var nz = ux * wy - uy * wx;
                        var len = Math.sqrt(nx * nx + ny * ny + nz * nz);
                        if (len < 1e-9) {
                            continue;
                        }
                        up[n] = Math.abs(ny) / len;

                        var b = n * 6;
                        box[b] = Math.min(ax, bx, cx);
                        box[b + 1] = Math.min(ay, by, cy);
                        box[b + 2] = Math.min(az, bz, cz);
                        box[b + 3] = Math.max(ax, bx, cx);
                        box[b + 4] = Math.max(ay, by, cy);
                        box[b + 5] = Math.max(az, bz, cz);

                        var x0 = Math.floor(box[b] / phys.cell);
                        var x1 = Math.floor(box[b + 3] / phys.cell);
                        var z0 = Math.floor(box[b + 2] / phys.cell);
                        var z1 = Math.floor(box[b + 5] / phys.cell);
                        for (var ix = x0; ix <= x1; ix++) {
                            for (var iz = z0; iz <= z1; iz++) {
                                var k = key(ix, iz);
                                var list = phys.grid.get(k);
                                if (!list) {
                                    list = [];
                                    phys.grid.set(k, list);
                                }
                                list.push(n);
                            }
                        }
                        n++;
                    }
                }

                phys.tris = tris;
                phys.box = box;
                phys.up = up;
                phys.stamp = new Uint32Array(n);
                phys.ready = true;
                return n;
            };

            // Triangles whose cells touch the square around x, z
            phys.near = function (x, z, r) {
                var out = phys.found;
                out.length = 0;
                phys.mark++;

                var x0 = Math.floor((x - r) / phys.cell);
                var x1 = Math.floor((x + r) / phys.cell);
                var z0 = Math.floor((z - r) / phys.cell);
                var z1 = Math.floor((z + r) / phys.cell);

                for (var ix = x0; ix <= x1; ix++) {
                    for (var iz = z0; iz <= z1; iz++) {
                        var list = phys.grid.get(key(ix, iz));
                        if (!list) {
                            continue;
                        }
                        for (var i = 0; i < list.length; i++) {
                            var t = list[i];
                            if (phys.stamp[t] !== phys.mark) {
                                phys.stamp[t] = phys.mark;
                                out.push(t);
                            }
                        }
                    }
                }
                return out;
            };

            // Highest walkable surface under x, z at or below top
            phys.floor = function (x, top, z) {
                var best = -Infinity;
                var near = phys.near(x, z, 0);
                var T = phys.tris;

                for (var i = 0; i < near.length; i++) {
                    var t = near[i];
                    if (phys.up[t] < 0.5) {
                        continue;
                    }
                    var b = t * 6;
                    if (x < phys.box[b] || x > phys.box[b + 3] || z < phys.box[b + 2] || z > phys.box[b + 5]) {
                        continue;
                    }
                    if (phys.box[b + 1] > top) {
                        continue;
                    }

                    var o = t * 9;
                    var ax = T[o], ay = T[o + 1], az = T[o + 2];
                    var bx = T[o + 3], by = T[o + 4], bz = T[o + 5];
                    var cx = T[o + 6], cy = T[o + 7], cz = T[o + 8];

                    // Barycentric weights in the XZ plane
                    var d = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);
                    if (Math.abs(d) < 1e-12) {
                        continue;
                    }
                    var w1 = ((bz - cz) * (x - cx) + (cx - bx) * (z - cz)) / d;
                    var w2 = ((cz - az) * (x - cx) + (ax - cx) * (z - cz)) / d;
                    var w3 = 1 - w1 - w2;
                    if (w1 < 0 || w2 < 0 || w3 < 0) {
                        continue;
                    }

                    var y = w1 * ay + w2 * by + w3 * cy;
                    if (y <= top && y > best) {
                        best = y;
                    }
                }
                return best;
            };

            // Closest point on triangle t to p (Ericson, Real-Time Collision Detection)
            var hit = [0, 0, 0];
            function closest(px, py, pz, t) {
                var T = phys.tris;
                var o = t * 9;
                var ax = T[o], ay = T[o + 1], az = T[o + 2];
                var bx = T[o + 3], by = T[o + 4], bz = T[o + 5];
                var cx = T[o + 6], cy = T[o + 7], cz = T[o + 8];

                var abx = bx - ax, aby = by - ay, abz = bz - az;
                var acx = cx - ax, acy = cy - ay, acz = cz - az;
                var apx = px - ax, apy = py - ay, apz = pz - az;

                var d1 = abx * apx + aby * apy + abz * apz;
                var d2 = acx * apx + acy * apy + acz * apz;
                if (d1 <= 0 && d2 <= 0) {
                    hit[0] = ax; hit[1] = ay; hit[2] = az;
                    return;
                }

                var bpx = px - bx, bpy = py - by, bpz = pz - bz;
                var d3 = abx * bpx + aby * bpy + abz * bpz;
                var d4 = acx * bpx + acy * bpy + acz * bpz;
                if (d3 >= 0 && d4 <= d3) {
                    hit[0] = bx; hit[1] = by; hit[2] = bz;
                    return;
                }

                var vc = d1 * d4 - d3 * d2;
                if (vc <= 0 && d1 >= 0 && d3 <= 0) {
                    var v = d1 / (d1 - d3);
                    hit[0] = ax + abx * v; hit[1] = ay + aby * v; hit[2] = az + abz * v;
                    return;
                }

                var cpx = px - cx, cpy = py - cy, cpz = pz - cz;
                var d5 = abx * cpx + aby * cpy + abz * cpz;
                var d6 = acx * cpx + acy * cpy + acz * cpz;
                if (d6 >= 0 && d5 <= d6) {
                    hit[0] = cx; hit[1] = cy; hit[2] = cz;
                    return;
                }

                var vb = d5 * d2 - d1 * d6;
                if (vb <= 0 && d2 >= 0 && d6 <= 0) {
                    var w = d2 / (d2 - d6);
                    hit[0] = ax + acx * w; hit[1] = ay + acy * w; hit[2] = az + acz * w;
                    return;
                }

                var va = d3 * d6 - d5 * d4;
                if (va <= 0 && d4 - d3 >= 0 && d5 - d6 >= 0) {
                    var e = (d4 - d3) / ((d4 - d3) + (d5 - d6));
                    hit[0] = bx + (cx - bx) * e; hit[1] = by + (cy - by) * e; hit[2] = bz + (cz - bz) * e;
                    return;
                }

                var inv = 1 / (va + vb + vc);
                var sv = vb * inv;
                var sw = vc * inv;
                hit[0] = ax + abx * sv + acx * sw;
                hit[1] = ay + aby * sv + acy * sw;
                hit[2] = az + abz * sv + acz * sw;
            }

            // Push the body's spheres out of walls and ceilings
            function pushOut(p) {
                var r = phys.radius;
                var near = phys.near(p.x, p.z, r + 0.05);

                for (var pass = 0; pass < 3; pass++) {
                    var moved = false;

                    for (var s = 0; s < phys.spheres.length; s++) {
                        var cy = p.y + phys.spheres[s];

                        for (var i = 0; i < near.length; i++) {
                            var t = near[i];
                            var b = t * 6;
                            var B = phys.box;
                            if (p.x + r < B[b] || p.x - r > B[b + 3]) { continue; }
                            if (cy + r < B[b + 1] || cy - r > B[b + 4]) { continue; }
                            if (p.z + r < B[b + 2] || p.z - r > B[b + 5]) { continue; }

                            closest(p.x, cy, p.z, t);
                            var dx = p.x - hit[0];
                            var dy = cy - hit[1];
                            var dz = p.z - hit[2];
                            var d2 = dx * dx + dy * dy + dz * dz;
                            if (d2 >= r * r || d2 < 1e-12) {
                                continue;
                            }

                            // Floors under the body are the ground check's job
                            if (phys.up[t] > 0.7 && hit[1] < cy) {
                                continue;
                            }

                            var d = Math.sqrt(d2);
                            var push = r - d;
                            var nx = dx / d;
                            var ny = dy / d;
                            var nz = dz / d;

                            p.x += nx * push;
                            p.z += nz * push;

                            // Bumping a ceiling stops the jump
                            if (ny < -0.5) {
                                p.y += ny * push;
                                if (p.vy > 0) {
                                    p.vy = 0;
                                }
                            }

                            // Slide along the wall instead of into it
                            var into = p.vx * nx + p.vz * nz;
                            if (into < 0) {
                                p.vx -= nx * into;
                                p.vz -= nz * into;
                            }
                            moved = true;
                        }
                    }

                    if (!moved) {
                        break;
                    }
                }
            }

            // One physics step for a walking body p (feet position)
            phys.walk = function (p, wishX, wishZ, jump, dt) {
                // Accelerate toward the wanted velocity: quick on the ground, loose in the air
                var grip = p.ground ? 12 : 2;
                var ease = 1 - Math.exp(-grip * dt);
                p.vx += (wishX - p.vx) * ease;
                p.vz += (wishZ - p.vz) * ease;

                if (jump && p.ground) {
                    p.vy = phys.jump;
                    p.ground = false;
                }

                p.x += p.vx * dt;
                p.z += p.vz * dt;
                pushOut(p);

                var wasGround = p.ground;
                p.vy -= phys.gravity * dt;
                var floor = phys.floor(p.x, p.y + phys.step, p.z);
                p.y += p.vy * dt;

                if (floor > -Infinity && p.y <= floor) {
                    // Landed, or walked up a step
                    p.y = floor;
                    p.vy = 0;
                    p.ground = true;
                } else if (wasGround && p.vy <= 0 && floor > -Infinity && p.y - floor < phys.step) {
                    // Stick to the floor going down stairs and slopes
                    p.y = floor;
                    p.vy = 0;
                    p.ground = true;
                } else {
                    p.ground = false;
                }
            };
        </script>

        <!-- Camera: fly and walk movement, fed to the engine's camera each frame -->
        <script type="module">
            var sz = window.sz;
            var cam = sz.cam;

            sz.setMode = function (mode) {
                if (mode === cam.mode) {
                    return;
                }
                if (mode === "walk") {
                    cam.y -= cam.eye;       // eye to feet
                    cam.eyeY = cam.y + cam.eye;
                } else {
                    cam.y = cam.eyeY;      // feet to eye
                }
                cam.vx = 0;
                cam.vy = 0;
                cam.vz = 0;
                cam.ground = false;
                cam.mode = mode;
                sz.hint();
            };

            function fly(dt, fx, fy, fz, rx, rz) {
                var k = cam.keys;
                var mx = 0;
                var my = 0;
                var mz = 0;

                if (k.KeyW) { mx += fx; my += fy; mz += fz; }
                if (k.KeyS) { mx -= fx; my -= fy; mz -= fz; }
                if (k.KeyD) { mx += rx; mz += rz; }
                if (k.KeyA) { mx -= rx; mz -= rz; }
                if (k.Space) { my += 1; }
                if (k.ShiftLeft || k.ShiftRight) { my -= 1; }

                var len = Math.sqrt(mx * mx + my * my + mz * mz);
                var speed = cam.flySpeed;
                if (k.ControlLeft) {
                    speed *= 3;
                }
                if (len > 0) {
                    mx = mx / len * speed;
                    my = my / len * speed;
                    mz = mz / len * speed;
                }

                // Ease the velocity so starts and stops are smooth
                var ease = 1 - Math.exp(-14 * dt);
                cam.vx += (mx - cam.vx) * ease;
                cam.vy += (my - cam.vy) * ease;
                cam.vz += (mz - cam.vz) * ease;

                cam.x += cam.vx * dt;
                cam.y += cam.vy * dt;
                cam.z += cam.vz * dt;
                cam.eyeY = cam.y;
            }

            function walk(dt, rx, rz) {
                var k = cam.keys;

                // Flat forward, so looking up or down doesn't change walking speed
                var fx = -Math.sin(cam.yaw);
                var fz = -Math.cos(cam.yaw);
                var mx = 0;
                var mz = 0;

                if (k.KeyW) { mx += fx; mz += fz; }
                if (k.KeyS) { mx -= fx; mz -= fz; }
                if (k.KeyD) { mx += rx; mz += rz; }
                if (k.KeyA) { mx -= rx; mz -= rz; }

                var len = Math.sqrt(mx * mx + mz * mz);
                var speed = cam.walkSpeed;
                if (k.ShiftLeft || k.ShiftRight || k.ControlLeft) {
                    speed *= 1.8;
                }
                if (len > 0) {
                    mx = mx / len * speed;
                    mz = mz / len * speed;
                }

                // Jump once per press
                var jump = k.Space && !cam.jumpHeld;
                cam.jumpHeld = !!k.Space;

                // Small fixed steps so fast falls can't pass through floors
                var steps = Math.ceil(dt / (1 / 120));
                var h = dt / steps;
                for (var i = 0; i < steps; i++) {
                    sz.phys.walk(cam, mx, mz, jump && i === 0, h);
                }

                // Fell out of the level: back to the start
                if (cam.y < -30) {
                    cam.x = 9.2;
                    cam.y = 0.5;
                    cam.z = -0.3;
                    cam.vx = 0;
                    cam.vy = 0;
                    cam.vz = 0;
                }

                // Smooth the eye over steps; follow jumps and falls directly
                var target = cam.y + cam.eye;
                if (cam.ground) {
                    cam.eyeY += (target - cam.eyeY) * (1 - Math.exp(-18 * dt));
                } else {
                    cam.eyeY = target;
                }
            }

            sz.moveCam = function (app, dt) {
                var cp = Math.cos(cam.pitch);
                var sp = Math.sin(cam.pitch);
                var cy = Math.cos(cam.yaw);
                var sy = Math.sin(cam.yaw);

                // Look direction and right direction
                var fx = -sy * cp;
                var fy = sp;
                var fz = -cy * cp;
                var rx = cy;
                var rz = -sy;

                if (cam.mode === "walk") {
                    // Hold still until the collision data is built
                    if (sz.phys.ready) {
                        walk(dt, rx, rz);
                    }
                } else {
                    fly(dt, fx, fy, fz, rx, rz);
                }

                var ex = cam.x;
                var ey = cam.eyeY;
                var ez = cam.z;
                app.camera.position.set([ex, ey, ez]);
                app.camera.target.set([ex + fx, ey + fy, ez + fz]);
                app.camera.update();
            };
        </script>

        <!-- Menu: settings panel and its scroll bar -->
        <script type="module">
            var sz = window.sz;
            var cam = sz.cam;
            var list = sz.list;
            var panel = sz.panel;

            var scroll = sz.scroll = {
                bar: document.getElementById("bar"),
                thumb: document.getElementById("thumb"),
                timer: 0,
                grab: null
            };

            scroll.update = function () {
                var view = list.clientHeight;
                var full = list.scrollHeight;
                var track = scroll.bar.clientHeight;

                if (full <= view + 1) {
                    scroll.bar.classList.add("hide");
                    return;
                }
                scroll.bar.classList.remove("hide");

                var size = Math.max(24, track * view / full);
                var room = track - size;
                var pos = room * list.scrollTop / (full - view);

                scroll.thumb.style.height = size + "px";
                scroll.thumb.style.top = pos + "px";
            };

            list.addEventListener("scroll", function () {
                scroll.update();
                scroll.bar.classList.add("active");
                clearTimeout(scroll.timer);
                scroll.timer = setTimeout(function () {
                    scroll.bar.classList.remove("active");
                }, 1000);
            });

            window.addEventListener("resize", scroll.update);

            scroll.thumb.addEventListener("mousedown", function (e) {
                scroll.grab = { y: e.clientY, top: list.scrollTop };
                e.preventDefault();
            });

            window.addEventListener("mousemove", function (e) {
                if (!scroll.grab) {
                    return;
                }
                var view = list.clientHeight;
                var full = list.scrollHeight;
                var room = scroll.bar.clientHeight - scroll.thumb.offsetHeight;
                var dy = e.clientY - scroll.grab.y;
                list.scrollTop = scroll.grab.top + dy * (full - view) / room;
            });

            window.addEventListener("mouseup", function () {
                scroll.grab = null;
            });

            // Clicking the empty track jumps a page
            scroll.bar.addEventListener("mousedown", function (e) {
                if (e.target !== scroll.bar) {
                    return;
                }
                var thumbTop = scroll.thumb.getBoundingClientRect().top;
                var page = list.clientHeight * 0.9;
                list.scrollTop += e.clientY < thumbTop ? -page : page;
            });

            document.getElementById("tab").onclick = function () {
                panel.classList.toggle("open");
                scroll.update();
            };

            // Keys typed in the menu shouldn't move the camera
            panel.addEventListener("keydown", function (e) {
                e.stopPropagation();
            });

            sz.buildMenu = function (app, lights) {
                var r = app.renderer;
                var defaults = [];
                var body = list;

                // Collapsible section: a header button and a body that starts closed
                function section(title) {
                    var box = document.createElement("div");
                    box.className = "sec";

                    var head = document.createElement("button");
                    head.className = "sec-head";
                    head.innerHTML = "<span class=\"arrow\">&#9656;</span>" + title;

                    var inner = document.createElement("div");
                    inner.className = "sec-body";

                    head.onclick = function () {
                        box.classList.toggle("open");
                        scroll.update();
                    };

                    box.appendChild(head);
                    box.appendChild(inner);
                    list.appendChild(box);
                    body = inner;
                }

                function slider(label, min, max, step, get, set) {
                    var row = document.createElement("div");
                    row.className = "row";

                    var lab = document.createElement("label");
                    var val = document.createElement("span");
                    lab.textContent = label;
                    lab.appendChild(val);

                    var input = document.createElement("input");
                    input.type = "range";
                    input.min = min;
                    input.max = max;
                    input.step = step;
                    input.value = get();

                    function show() {
                        var digits = step < 0.01 ? 3 : (step < 1 ? 2 : 0);
                        val.textContent = Number(input.value).toFixed(digits);
                    }

                    input.oninput = function () {
                        set(Number(input.value));
                        show();
                    };
                    show();

                    row.appendChild(lab);
                    row.appendChild(input);
                    body.appendChild(row);

                    var start = get();
                    defaults.push(function () {
                        input.value = start;
                        set(start);
                        show();
                    });
                }

                function toggle(label, get, set) {
                    var lab = document.createElement("label");
                    lab.className = "check";

                    var box = document.createElement("input");
                    box.type = "checkbox";
                    box.checked = get();
                    box.onchange = function () {
                        set(box.checked);
                    };

                    lab.appendChild(box);
                    lab.appendChild(document.createTextNode(label));
                    body.appendChild(lab);

                    var start = get();
                    defaults.push(function () {
                        box.checked = start;
                        set(start);
                    });
                }

                // Drop-down. options: [[value, label], ...]
                function choice(label, options, get, set) {
                    var row = document.createElement("div");
                    row.className = "row";

                    var lab = document.createElement("label");
                    lab.textContent = label;

                    var sel = document.createElement("select");
                    for (var i = 0; i < options.length; i++) {
                        var opt = document.createElement("option");
                        opt.value = String(options[i][0]);
                        opt.textContent = options[i][1];
                        sel.appendChild(opt);
                    }
                    sel.value = String(get());
                    sel.onchange = function () {
                        set(sel.value);
                    };

                    row.appendChild(lab);
                    row.appendChild(sel);
                    body.appendChild(row);

                    var start = String(get());
                    defaults.push(function () {
                        sel.value = start;
                        set(start);
                    });
                }

                function button(label, onClick, parent) {
                    var b = document.createElement("button");
                    b.className = "btn";
                    b.textContent = label;
                    b.onclick = onClick;
                    (parent || body).appendChild(b);
                    return b;
                }

                section("Window");
                var fsBtn = button("Fullscreen", function () {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                        return;
                    }
                    var req = document.documentElement.requestFullscreen();
                    if (req && req.catch) {
                        req.catch(function () {
                            sz.msg.textContent = "Fullscreen isn't allowed here";
                        });
                    }
                });
                document.addEventListener("fullscreenchange", function () {
                    fsBtn.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
                });
                slider("Resolution scale", 0.5, 2, 0.25,
                    function () { return app.maxDpr; },
                    function (v) { app.maxDpr = v; });
                toggle("Anti-aliasing (FXAA)",
                    function () { return r.fxaa; },
                    function (v) { r.fxaa = v; });

                section("Movement");
                var modeBtn = button("", function () {
                    sz.setMode(cam.mode === "walk" ? "fly" : "walk");
                    showMode();
                });
                function showMode() {
                    modeBtn.textContent = cam.mode === "walk" ? "Mode: First person (walk)" : "Mode: Fly";
                }
                showMode();
                slider("Walk speed", 1, 8, 0.1,
                    function () { return cam.walkSpeed; },
                    function (v) { cam.walkSpeed = v; });
                slider("Fly speed", 1, 15, 0.5,
                    function () { return cam.flySpeed; },
                    function (v) { cam.flySpeed = v; });
                slider("Jump power", 2, 9, 0.1,
                    function () { return sz.phys.jump; },
                    function (v) { sz.phys.jump = v; });
                slider("Mouse sensitivity", 0.5, 3, 0.1,
                    function () { return cam.sens; },
                    function (v) { cam.sens = v; });

                section("Camera and exposure");
                toggle("Physical light units",
                    function () { return r.physical.enabled; },
                    function (v) { lights.setPhysical(v); });
                slider("Exposure (manual)", 0.2, 3, 0.05,
                    function () { return r.exposure; },
                    function (v) { r.exposure = v; });
                slider("Aperture (f-stop)", 1.4, 22, 0.1,
                    function () { return r.physical.aperture; },
                    function (v) { r.physical.aperture = v; });
                choice("Shutter speed", [
                    [1 / 8, "1/8 s"], [1 / 15, "1/15 s"], [1 / 30, "1/30 s"], [1 / 60, "1/60 s"],
                    [1 / 125, "1/125 s"], [1 / 250, "1/250 s"], [1 / 500, "1/500 s"]
                ],
                    function () { return r.physical.shutter; },
                    function (v) { r.physical.shutter = Number(v); });
                slider("ISO", 50, 3200, 50,
                    function () { return r.physical.iso; },
                    function (v) { r.physical.iso = v; });
                slider("Exposure compensation", -4, 4, 0.1,
                    function () { return r.physical.compensation; },
                    function (v) { r.physical.compensation = v; });
                toggle("Auto exposure",
                    function () { return r.autoExposure.enabled; },
                    function (v) { r.autoExposure.enabled = v; });
                slider("Adapt speed", 0.2, 6, 0.1,
                    function () { return r.autoExposure.speed; },
                    function (v) { r.autoExposure.speed = v; });
                slider("Auto min (stops)", -8, 0, 0.5,
                    function () { return r.autoExposure.min; },
                    function (v) { r.autoExposure.min = v; });
                slider("Auto max (stops)", 0, 8, 0.5,
                    function () { return r.autoExposure.max; },
                    function (v) { r.autoExposure.max = v; });

                section("Lighting and shadows");
                slider("Sky light", 0, 3000, 50,
                    function () { return lights.getSky(); },
                    function (v) { lights.setSky(v); });
                slider("Ambient", 0, 3, 0.05,
                    function () { return lights.ambientMul; },
                    function (v) { lights.setAmbient(v); });
                toggle("Shadows",
                    function () { return r.shadows.enabled; },
                    function (v) { r.shadows.enabled = v; });
                slider("Shadow softness", 0.5, 4, 0.1,
                    function () { return r.shadows.pcfRadius; },
                    function (v) { r.shadows.pcfRadius = v; });
                slider("Shadow resolution", 256, 2048, 256,
                    function () { return r.shadows.size; },
                    function (v) { r.shadows.size = v; });

                section("Reflections (SSR)");
                slider("Intensity", 0, 1, 0.05,
                    function () { return r.ssr.intensity; },
                    function (v) { r.ssr.intensity = v; });
                slider("Quality (steps)", 8, 64, 4,
                    function () { return r.ssr.steps; },
                    function (v) { r.ssr.steps = v; });
                slider("Max distance", 5, 80, 1,
                    function () { return r.ssr.maxDistance; },
                    function (v) { r.ssr.maxDistance = v; });

                section("Ambient occlusion (SSAO)");
                slider("Intensity", 0, 2, 0.05,
                    function () { return r.ao.intensity; },
                    function (v) { r.ao.intensity = v; });
                slider("Radius", 0.1, 3, 0.05,
                    function () { return r.ao.radius; },
                    function (v) { r.ao.radius = v; });
                slider("Power", 0.5, 3, 0.05,
                    function () { return r.ao.power; },
                    function (v) { r.ao.power = v; });

                section("Indirect light (SSIL)");
                slider("Intensity", 0, 3, 0.05,
                    function () { return r.ssil.intensity; },
                    function (v) { r.ssil.intensity = v; });
                slider("Radius", 0.5, 8, 0.1,
                    function () { return r.ssil.radius; },
                    function (v) { r.ssil.radius = v; });

                section("Volumetric fog");
                toggle("Enabled",
                    function () { return r.volumetric.enabled; },
                    function (v) { r.volumetric.enabled = v; });
                slider("Density", 0, 0.15, 0.001,
                    function () { return r.volumetric.density; },
                    function (v) { r.volumetric.density = v; });
                slider("Height falloff", 0, 1, 0.01,
                    function () { return r.volumetric.heightFalloff; },
                    function (v) { r.volumetric.heightFalloff = v; });
                slider("Light scattering", 0, 4, 0.05,
                    function () { return r.volumetric.lightScatter; },
                    function (v) { r.volumetric.lightScatter = v; });
                slider("Ambient scattering", 0, 4, 0.05,
                    function () { return r.volumetric.ambient; },
                    function (v) { r.volumetric.ambient = v; });
                slider("Anisotropy", -0.9, 0.9, 0.05,
                    function () { return r.volumetric.anisotropy; },
                    function (v) { r.volumetric.anisotropy = v; });
                slider("Quality (steps)", 8, 64, 4,
                    function () { return r.volumetric.steps; },
                    function (v) { r.volumetric.steps = v; });

                section("Bloom and haze");
                slider("Bloom", 0, 1.5, 0.05,
                    function () { return r.bloom.strength; },
                    function (v) { r.bloom.strength = v; });
                slider("Bloom threshold", 0, 4, 0.05,
                    function () { return r.bloom.threshold; },
                    function (v) { r.bloom.threshold = v; });
                slider("Distance haze", 0, 1, 0.05,
                    function () { return r.aerialPerspective; },
                    function (v) { r.aerialPerspective = v; });

                section("Tonemap and color");
                choice("Tonemapper", [
                    ["linear", "Linear"], ["reinhard", "Reinhard"], ["filmic", "Filmic"],
                    ["aces", "ACES"], ["agx", "AgX"]
                ],
                    function () { return r.tonemap.mode; },
                    function (v) { r.tonemap.mode = v; });
                slider("White point", 1, 16, 0.5,
                    function () { return r.tonemap.white; },
                    function (v) { r.tonemap.white = v; });
                slider("Brightness", 0.2, 2, 0.05,
                    function () { return r.tonemap.brightness; },
                    function (v) { r.tonemap.brightness = v; });
                slider("Contrast", 0.5, 1.8, 0.05,
                    function () { return r.tonemap.contrast; },
                    function (v) { r.tonemap.contrast = v; });
                slider("Saturation", 0, 2, 0.05,
                    function () { return r.tonemap.saturation; },
                    function (v) { r.tonemap.saturation = v; });

                // One reset for everything, outside the sections
                button("Reset everything to defaults", function () {
                    for (var i = 0; i < defaults.length; i++) {
                        defaults[i]();
                    }
                }, list).classList.add("reset");

                scroll.update();
            };
        </script>

        <!-- Scene: engine setup, model, lights, collision data, frame loop -->
        <script type="module">
            var sz = window.sz;
            var msg = sz.msg;

            if (!navigator.gpu) {
                msg.textContent = "This browser doesn't support WebGPU.";
            } else if (!window.Axion || !window.AxionAssets || !AxionAssets.sponza) {
                msg.textContent = "Couldn't load the engine or the model from jsDelivr.";
            } else {
                Axion.App.create(sz.canvas, {
                    clearColor: [0.05, 0.06, 0.08, 1],
                    ambient: [0.10, 0.105, 0.12],
                    groundAmbient: 0.45,
                    exposure: 1.1,
                    ssr: { steps: 24, maxDistance: 40, fadeDistance: 60, thickness: 0.35 },
                    ao: { radius: 0.9, fadeDistance: 35 },
                    bloom: { threshold: 1.2, strength: 0.35 },
                    shadows: { maxLights: 3, size: 1024, pcfRadius: 1.4, near: 0.1 },
                    ssil: { intensity: 1, radius: 3 },
                    volumetric: { enabled: false, density: 0.015, heightFalloff: 0.1, anisotropy: 0.3 },
                    tonemap: { mode: "aces" },
                    autoExposure: { enabled: false },
                    physical: { enabled: false, aperture: 2.8, shutter: 1 / 30, iso: 400 }
                }).then(function (app) {
                    sz.app = app;
                    msg.textContent = "decoding Sponza…";

                    return Axion.loadGLTF(app, AxionAssets.sponza, {
                        onProgress: function (stage, done, total) {
                            if (stage === "textures") {
                                msg.textContent = "textures " + done + " / " + total;
                            } else {
                                msg.textContent = stage + "…";
                            }
                        }
                    }).then(function () {
                        var r = app.renderer;
                        var skyLight = app.light([1.5, 26, 0.6], { color: [1, 0.94, 0.86], intensity: 1400, range: 70 });
                        var warm = app.light([6, 1.8, -0.2], { color: [1, 0.62, 0.32], intensity: 55, range: 16 });
                        var cool = app.light([-4, 2.6, 2.4], { color: [0.45, 0.62, 1], intensity: 55, range: 16 });

                        // Lights keep a base brightness; physical mode converts it to lumens.
                        // The factors are picked so the starting camera (f/2.8, 1/30 s, ISO 400)
                        // shows the same image, then aperture, shutter and ISO act like a real camera.
                        var lights = {
                            list: [
                                { e: skyLight, base: 1400 },
                                { e: warm, base: 55 },
                                { e: cool, base: 55 }
                            ],
                            ambientBase: r.ambient.slice(),
                            ambientMul: 1,
                            lumens: 1,
                            nits: 1
                        };

                        r.physical.enabled = true;
                        var physExposure = r.effectiveExposure();
                        r.physical.enabled = false;
                        var toPhysical = r.exposure / physExposure;

                        lights.apply = function () {
                            var phys = r.physical.enabled;
                            for (var i = 0; i < lights.list.length; i++) {
                                var l = lights.list[i];
                                var c = app.world.get(l.e, Axion.PointLight);
                                // PointLight data is [r, g, b, intensity, range]
                                c.array[c.offset + 3] = phys ? l.base * toPhysical * 4 * Math.PI : l.base;
                            }
                            var k = lights.ambientMul * (phys ? toPhysical : 1);
                            r.ambient = [
                                lights.ambientBase[0] * k,
                                lights.ambientBase[1] * k,
                                lights.ambientBase[2] * k
                            ];
                        };

                        lights.getSky = function () {
                            return lights.list[0].base;
                        };
                        lights.setSky = function (v) {
                            lights.list[0].base = v;
                            lights.apply();
                        };
                        lights.setAmbient = function (v) {
                            lights.ambientMul = v;
                            lights.apply();
                        };
                        lights.setPhysical = function (on) {
                            r.physical.enabled = on;
                            lights.apply();
                        };

                        // Start in the start spot; walk mode drops onto the floor below
                        sz.cam.y -= sz.cam.eye;
                        sz.cam.eyeY = sz.cam.y + sz.cam.eye;

                        app.onFrame(function (dt) {
                            sz.moveCam(app, dt);
                        });

                        sz.buildMenu(app, lights);
                        sz.ready = true;
                        sz.hint();
                        app.start();

                        // Collision reads the same model's triangles on the CPU
                        return Axion.unpackAsset(AxionAssets.sponza).then(function (bytes) {
                            var glb = Axion.parseGLB(bytes);
                            var model = Axion.parseGLTF(glb.json, [glb.bin]);
                            sz.phys.build(model.primitives);
                        });
                    });
                }).catch(function (e) {
                    msg.textContent = "Error: " + (e.message || e);
                });
            }
        </script>

        <!-- Khan Academy thumbnail -->
        <script type="module">
            var size = 600;

            function findCanvas() {
                var all = document.getElementsByTagName("canvas");
                for (var i = 0; i < all.length; i++) {
                    var rect = all[i].getBoundingClientRect();
                    if (rect.width > 0 && rect.height > 0) {
                        return all[i];
                    }
                }
                return null;
            }

            window.parent.html2canvas = function () {
                try {
                    var c;
                    var app = window.Axion && Axion.App.current;

                    if (app) {
                        // WebGPU canvases have to be copied right after a render
                        c = app.snapshot(size, size);
                    } else {
                        var src = findCanvas();
                        if (!src) {
                            throw "No visible canvas found.";
                        }
                        c = document.createElement("canvas");
                        c.width = size;
                        c.height = size;
                        c.getContext("2d").drawImage(src, 0, 0, src.width, src.height, 0, 0, size, size);
                    }

                    window.top.postMessage(c.toDataURL(), "*");
                } catch (e) {
                    alert("Thumbnail Script Error: " + e);
                    window.top.postMessage(document.createElement("canvas").toDataURL(), "*");
                }
            };
        </script>
