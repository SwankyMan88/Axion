<!DOCTYPE html>
<!--
  Sponza in Axion, on Khan Academy. Paste into a "Webpage with HTML/JS" program.

  Both files come from GitHub through jsDelivr as plain <script> tags — the
  only kind of load KA's security policy is sure to allow. assets/sponza.js is
  the whole model (geometry + 69 WebP textures, ~16 MB) as one gzip+base64
  string; Axion.loadGLTF decodes it in the browser.

  Controls: WASD move · mouse drag (or click for pointer lock) to look ·
  Space / Shift up/down · Ctrl faster.
-->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; background: #070a0f; overflow: hidden; font: 13px system-ui, sans-serif; color: #cfd8e3; }
    canvas { display: block; width: 100%; height: 100%; }
    #msg { position: fixed; left: 12px; top: 10px; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="msg">loading engine…</div>
  <script src="https://cdn.jsdelivr.net/gh/SwankyMan88/Axion@v0.4.1/dist/axion.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/SwankyMan88/Axion@v0.4.1/assets/sponza.js"></script>
  <script>
  (async () => {
    const msg = document.getElementById('msg');
    if (!navigator.gpu) { msg.textContent = 'No WebGPU in this browser/iframe.'; return; }
    if (!window.Axion || !window.AxionAssets?.sponza) { msg.textContent = 'Scripts blocked or not yet on jsDelivr.'; return; }
    const AX = window.Axion;
    try {
      const app = await AX.App.create(document.getElementById('c'), {
        clearColor: [0.05, 0.06, 0.08, 1], ambient: [0.10, 0.105, 0.12], groundAmbient: 0.45, exposure: 1.1,
        ssr: { steps: 24, maxDistance: 40, fadeDistance: 60, thickness: 0.35 },
        ao: { radius: 0.9, fadeDistance: 35 }, bloom: { threshold: 1.2, strength: 0.35 },
        shadows: { maxLights: 3, size: 1024, pcfRadius: 1.4, near: 0.1 },
        fly: { speed: 4, position: [10.5, 1.7, -0.3] },
      });
      msg.textContent = 'decoding Sponza…';
      await AX.loadGLTF(app, AxionAssets.sponza, {
        onProgress: (stage, done, total) => { msg.textContent = stage === 'textures' ? `textures ${done}/${total}` : stage + '…'; },
      });
      app.light([1.5, 26, 0.6], { color: [1, 0.94, 0.86], intensity: 1400, range: 70 });
      [app.light([6, 1.8, -0.2], { color: [1, 0.62, 0.32], intensity: 55, range: 16 }),
                       app.light([-4, 2.6, 2.4], { color: [0.45, 0.62, 1], intensity: 55, range: 16 })];
      app.setCameraMode('fly');
      app.fly.position.set([10.5, 1.7, -0.3]);
      app.fly.yaw = Math.PI / 2;
      msg.textContent = 'WASD + drag to look';
      app.start();
    } catch (e) { msg.textContent = 'Error: ' + (e.message || e); }
  })();
  </script>
</body>
</html>
