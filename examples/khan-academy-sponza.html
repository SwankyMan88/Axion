<!DOCTYPE html>
<!--
  Sponza in Axion, for a Khan Academy "Webpage" program. ES5, fullscreen.
  Controls: WASD move, drag (or click for pointer lock) to look,
  Space / Shift up and down, Ctrl faster.
  The model is ~16 MB, so the first load takes a few seconds.
-->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #070a0f; }
    canvas { display: block; width: 100%; height: 100%; }
    #msg { position: fixed; left: 10px; top: 8px; color: #cfd8e3; font: 13px sans-serif; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="msg">loading…</div>
  <script src="https://cdn.jsdelivr.net/gh/SwankyMan88/Axion@v0.4.3/dist/axion.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/SwankyMan88/Axion@v0.4.3/assets/sponza.js"></script>
  <script>
    var msg = document.getElementById("msg");

    if (!navigator.gpu) {
      msg.textContent = "This browser doesn't support WebGPU.";
    } else if (!window.Axion || !window.AxionAssets || !AxionAssets.sponza) {
      msg.textContent = "Couldn't load the engine or the model from jsDelivr.";
    } else {
      Axion.App.create(document.getElementById("c"), {
        clearColor: [0.05, 0.06, 0.08, 1],
        ambient: [0.10, 0.105, 0.12],
        groundAmbient: 0.45,
        exposure: 1.1,
        ssr: { steps: 24, maxDistance: 40, fadeDistance: 60, thickness: 0.35 },
        ao: { radius: 0.9, fadeDistance: 35 },
        bloom: { threshold: 1.2, strength: 0.35 },
        shadows: { maxLights: 3, size: 1024, pcfRadius: 1.4, near: 0.1 }
      }).then(function (app) {
        msg.textContent = "decoding Sponza…";
        return Axion.loadGLTF(app, AxionAssets.sponza, {
          onProgress: function (stage, done, total) {
            msg.textContent = stage === "textures" ? "textures " + done + " / " + total : stage + "…";
          }
        }).then(function () {
          // Sky light through the open roof, plus two warm and cool fills.
          app.light([1.5, 26, 0.6], { color: [1, 0.94, 0.86], intensity: 1400, range: 70 });
          app.light([6, 1.8, -0.2], { color: [1, 0.62, 0.32], intensity: 55, range: 16 });
          app.light([-4, 2.6, 2.4], { color: [0.45, 0.62, 1], intensity: 55, range: 16 });

          // Fly camera, starting at the east end looking down the nave.
          app.setCameraMode("fly");
          app.fly.position.set([10.5, 1.7, -0.3]);
          app.fly.yaw = Math.PI / 2;
          app.fly.pitch = 0.02;
          app.fly.speed = 4;

          msg.textContent = "WASD to move, drag to look";
          app.start();
        });
      }).catch(function (e) {
        msg.textContent = "Error: " + (e.message || e);
      });
    }
  </script>
</body>
</html>
