<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Pine Valley</title>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: rgb(7, 10, 16);
                font: 12px sans-serif;
            }

            canvas {
                display: block;
                width: 100%;
                height: 100%;
            }

            #msg {
                position: fixed;
                left: 50px;
                top: 12px;
                right: 10px;
                color: rgb(206, 216, 228);
                font-size: 13px;
                text-shadow: 0 1px 2px rgb(0, 0, 0);
                pointer-events: none;
            }

            #status {
                position: fixed;
                left: 10px;
                bottom: 8px;
                color: rgb(151, 166, 187);
                font-size: 11px;
                text-shadow: 0 1px 2px rgb(0, 0, 0);
                pointer-events: none;
            }

            #tab {
                position: fixed;
                left: 10px;
                top: 8px;
                width: 30px;
                height: 26px;
                z-index: 3;
                padding: 0;
                border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 6px;
                background: rgba(14, 18, 27, 0.86);
                color: rgb(206, 216, 228);
                font-size: 16px;
                line-height: 24px;
                cursor: pointer;
            }

            #tab:hover {
                background: rgba(41, 51, 69, 0.95);
            }

            /* Sliding menu */
            #panel {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 250px;
                z-index: 2;
                background: rgba(10, 13, 20, 0.93);
                color: rgb(206, 216, 228);
                border-right: 1px solid rgba(255, 255, 255, 0.11);
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }

            #panel.open {
                transform: translateX(0);
            }

            #list {
                position: absolute;
                inset: 0;
                padding: 44px 20px 14px 14px;
                overflow-y: auto;
                scrollbar-width: none;
            }

            #list::-webkit-scrollbar {
                display: none;
            }

            #list h3 {
                margin: 14px 0 6px;
                font-size: 11px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: rgb(127, 143, 164);
            }

            .row {
                margin: 7px 0;
            }

            .row label {
                display: flex;
                justify-content: space-between;
                margin-bottom: 2px;
            }

            .row label span {
                color: rgb(143, 178, 254);
            }

            .row input[type=range] {
                width: 100%;
                margin: 0;
            }

            .check {
                display: flex;
                align-items: center;
                gap: 6px;
                margin: 7px 0;
                cursor: pointer;
            }

            .btn {
                width: 100%;
                margin-top: 8px;
                padding: 6px;
                border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 5px;
                background: rgb(27, 34, 49);
                color: rgb(206, 216, 228);
                cursor: pointer;
            }

            .btn:hover {
                background: rgb(38, 48, 67);
            }

            /* Custom scroll bar: thin pixel strip, wider while scrolling or hovered */
            #bar {
                position: absolute;
                right: 2px;
                top: 40px;
                bottom: 6px;
                width: 14px;
            }

            #thumb {
                position: absolute;
                right: 0;
                width: 3px;
                min-height: 24px;
                border-radius: 1px;
                background-color: rgb(96, 113, 139);
                background-image:
                    linear-gradient(90deg, rgba(0, 0, 0, 0.27) 50%, transparent 50%),
                    linear-gradient(rgba(255, 255, 255, 0.13) 50%, transparent 50%);
                background-size: 2px 2px, 4px 4px;
                image-rendering: pixelated;
                transition: width 0.18s ease, background-color 0.18s ease;
                cursor: pointer;
            }

            #bar:hover #thumb,
            #bar.active #thumb {
                width: 9px;
                background-color: rgb(131, 152, 187);
            }

            #bar.hide {
                display: none;
            }

            /* Collapsible sections */
            .sec {
                border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            }

            .sec-head {
                display: block;
                width: 100%;
                padding: 9px 2px;
                border: 0;
                background: none;
                color: rgb(171, 186, 207);
                font: 11px sans-serif;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                text-align: left;
                cursor: pointer;
            }

            .sec-head:hover {
                color: rgb(222, 231, 243);
            }

            .arrow {
                display: inline-block;
                width: 14px;
                transition: transform 0.15s ease;
            }

            .sec.open .arrow {
                transform: rotate(90deg);
            }

            .sec-body {
                display: none;
                padding: 0 2px 10px;
            }

            .sec.open .sec-body {
                display: block;
            }

            select {
                width: 100%;
                padding: 3px;
                border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 4px;
                background: rgb(21, 27, 39);
                color: rgb(206, 216, 228);
            }

            .reset {
                margin-top: 14px;
            }

            /* Controls that don't apply in the current mode */
            .off {
                opacity: 0.38;
                pointer-events: none;
            }

            .info {
                margin: 4px 0 8px;
                color: rgb(127, 143, 164);
                font-size: 11px;
            }

            /* Loading screen */
            #load {
                position: fixed;
                inset: 0;
                z-index: 4;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                background: rgb(9, 13, 19);
                color: rgb(206, 216, 228);
                font-size: 14px;
                transition: opacity 0.6s ease;
            }

            #load.done {
                opacity: 0;
                pointer-events: none;
            }

            #loadTitle {
                font-size: 22px;
                letter-spacing: 0.06em;
                color: rgb(226, 232, 240);
            }

            #loadBar {
                width: 260px;
                height: 6px;
                border-radius: 3px;
                background: rgb(30, 38, 52);
                overflow: hidden;
            }

            #loadPlay {
                display: none;
                margin-top: 6px;
                padding: 11px 46px;
                border: 0;
                border-radius: 22px;
                background: rgb(118, 172, 106);
                color: rgb(14, 22, 12);
                font: bold 16px sans-serif;
                letter-spacing: 0.05em;
                cursor: pointer;
            }

            #loadPlay:hover {
                background: rgb(142, 196, 128);
            }

            #loadFull {
                margin-top: 10px;
                padding: 8px 20px;
                border: 1px solid rgba(160, 205, 150, 0.45);
                border-radius: 18px;
                background: rgba(120, 170, 110, 0.12);
                color: rgb(206, 226, 200);
                font: 13px sans-serif;
                letter-spacing: 0.03em;
                cursor: pointer;
            }

            #loadFull:hover {
                background: rgba(120, 170, 110, 0.28);
                border-color: rgb(150, 200, 140);
            }

            #loadFill {
                width: 0;
                height: 100%;
                background: rgb(120, 170, 110);
                transition: width 0.2s ease;
            }

            #stats {
                position: fixed;
                right: 10px;
                bottom: 8px;
                color: rgb(151, 166, 187);
                font-size: 11px;
                text-align: right;
                text-shadow: 0 1px 2px rgb(0, 0, 0);
                pointer-events: none;
                white-space: pre;
            }
        </style>
    </head>
    <body>
        <canvas id="c"></canvas>
        <div id="load">
            <div id="loadTitle">Pine Valley</div>
            <div id="loadBar"><div id="loadFill"></div></div>
            <div id="loadText">starting…</div>
            <button id="loadPlay" type="button">Play</button>
            <button id="loadFull" type="button">Play in fullscreen</button>
        </div>
        <div id="msg"></div>
        <div id="status">collision: waiting</div>
        <div id="stats"></div>
        <button id="tab" title="Settings">&#9776;</button>
        <div id="panel">
            <div id="list"></div>
            <div id="bar"><div id="thumb"></div></div>
        </div>

        <script src="https://cdn.jsdelivr.net/gh/SwankyMan88/Axion@v0.9.4/dist/axion.min.js"></script><!-- My 3D engine Axion -->

        <!-- Shared state -->
        <script type="module">
            (function () {
                var vl = window.vl = {};

                // Where the world's asset packs live
                vl.base = "https://cdn.jsdelivr.net/gh/SwankyMan88/Axion@v0.9.4/assets/";
                // The world comes in two files; each holds some of the packs
                vl.files = ["pine-valley-1", "pine-valley-2"];
                vl.packs = [
                    { name: "valley-map", file: 0 },
                    { name: "valley-trees", file: 0 },
                    { name: "valley-nature", file: 1 },
                    { name: "valley-props", file: 1 }
                ];

                vl.canvas = document.getElementById("c");
                vl.msg = document.getElementById("msg");
                vl.panel = document.getElementById("panel");
                vl.list = document.getElementById("list");
                vl.statsEl = document.getElementById("stats");

                vl.app = null;
                vl.ready = false;
                vl.showStats = true;

                vl.statusEl = document.getElementById("status");
                vl.status = function (text) {
                    vl.statusEl.textContent = "collision: " + text;
                };

                // Loading screen
                vl.loadText = document.getElementById("loadText");
                vl.loadFill = document.getElementById("loadFill");
                vl.progress = function (text, share) {
                    vl.loadText.textContent = text;
                    if (share !== undefined) {
                        vl.loadFill.style.width = Math.round(share * 100) + "%";
                    }
                };

                // Any uncaught error shows up on screen instead of vanishing
                window.addEventListener("error", function (e) {
                    vl.statusEl.textContent = "error: " + e.message + " (line " + e.lineno + ")";
                    vl.loadText.textContent = "error: " + e.message;
                });
                window.addEventListener("unhandledrejection", function (e) {
                    var r = e.reason;
                    vl.statusEl.textContent = "error: " + (r && r.message ? r.message : r);
                    vl.loadText.textContent = "error: " + (r && r.message ? r.message : r);
                });

                // Camera / player. x, y, z is the eye in fly mode and the feet in walk mode.
                vl.cam = {
                    mode: "walk",
                    x: 0,
                    y: 0,
                    z: 0,
                    yaw: 0,
                    pitch: 0,
                    vx: 0,
                    vy: 0,
                    vz: 0,
                    eye: 1.65,
                    swimEye: 1.55,
                    eyeY: 0,
                    ground: false,
                    swim: false,
                    flySpeed: 12,
                    walkSpeed: 3.4,
                    sens: 1,
                    keys: {},
                    jumpHeld: false,
                    locked: false,
                    drag: false,
                    bob: 0
                };

                vl.hint = function () {
                    if (!vl.ready) {
                        return;
                    }
                    var how = vl.cam.mode === "walk"
                        ? "WASD walk · Shift run · Space jump · F fly"
                        : "WASD fly · Space / Shift up and down · Q fast · F walk";
                    if (vl.cam.locked) {
                        vl.msg.textContent = how + " · Esc to release the mouse";
                    } else {
                        vl.msg.textContent = "Click to look around · " + how;
                    }
                };
            })();
        </script>

        <!-- Input -->
        <script type="module">
            (function () {
                var vl = window.vl;
                var cam = vl.cam;

                window.addEventListener("keydown", function (e) {
                    cam.keys[e.code] = true;
                    // While playing, keys belong to the game, not the browser:
                    // Ctrl+D (bookmark), Ctrl+S, Space scrolling and the rest.
                    // Esc still releases the mouse.
                    if (e.code === "Space" || ((cam.locked || cam.drag) && e.code !== "Escape")) {
                        e.preventDefault();
                    }
                    if (e.code === "KeyF" && !e.repeat && vl.setMode) {
                        vl.setMode(cam.mode === "walk" ? "fly" : "walk");
                        if (vl.showMode) {
                            vl.showMode();
                        }
                    }
                });

                window.addEventListener("keyup", function (e) {
                    cam.keys[e.code] = false;
                });

                window.addEventListener("blur", function () {
                    cam.keys = {};
                });

                vl.canvas.addEventListener("mousedown", function (e) {
                    if (e.button !== 0) {
                        return;
                    }
                    vl.panel.classList.remove("open");

                    // Drag-to-look stays on in case the page won't allow a lock
                    cam.drag = true;

                    var canvas = vl.canvas;
                    var req = canvas.requestPointerLock ? canvas.requestPointerLock() : null;
                    if (req && req.catch) {
                        req.catch(function () {});
                    }
                });

                window.addEventListener("mouseup", function () {
                    cam.drag = false;
                });

                document.addEventListener("pointerlockchange", function () {
                    cam.locked = document.pointerLockElement === vl.canvas;
                    // A few shortcuts (Ctrl+W, Ctrl+T, Ctrl+N) can only be held
                    // back in fullscreen, where browsers offer a keyboard lock
                    var kb = navigator.keyboard;
                    if (kb && kb.lock) {
                        if (cam.locked && (document.fullscreenElement || document.webkitFullscreenElement)) {
                            kb.lock().catch(function () {});
                        } else if (!cam.locked && kb.unlock) {
                            kb.unlock();
                        }
                    }
                    vl.hint();
                });

                window.addEventListener("mousemove", function (e) {
                    if (!cam.locked && !cam.drag) {
                        return;
                    }
                    var k = 0.0024 * cam.sens;
                    cam.yaw -= e.movementX * k;
                    cam.pitch -= e.movementY * k;
                    cam.pitch = Math.max(-1.55, Math.min(1.55, cam.pitch));
                });
            })();
        </script>

        <!-- Loading the world's packs, one after another -->
        <script type="module">
            (function () {
                var vl = window.vl;

                // Adds a script tag and waits for it. The tag name is split so
                // nothing that processes this page can mistake it for a real tag.
                function addScript(url) {
                    return new Promise(function (ok, fail) {
                        var s = document.createElement("scr" + "ipt");
                        s.src = url;
                        s.onload = ok;
                        s.onerror = function () {
                            s.parentNode.removeChild(s);
                            fail(new Error("couldn't load " + url));
                        };
                        document.head.appendChild(s);
                    });
                }

                // The CDN sometimes turns away the first request for a new
                // version while it fetches it, so a failed file is tried again
                vl.loadScript = function (url) {
                    var tries = 0;
                    function attempt() {
                        var u = tries ? url + "?try=" + tries : url;
                        return addScript(u).catch(function (e) {
                            tries++;
                            if (tries > 4) {
                                throw e;
                            }
                            vl.progress("the download stalled, trying again (" + tries + ")…");
                            return new Promise(function (ok) {
                                setTimeout(ok, 1500 * tries);
                            }).then(attempt);
                        });
                    }
                    return attempt();
                };

                // Downloads both files at once, then hands the packs over in
                // order; `each(name, i)` runs once a pack's file is in
                vl.loadPacks = function (each) {
                    var waits = [];
                    for (var j = 0; j < vl.files.length; j++) {
                        waits.push(vl.loadScript(vl.base + vl.files[j] + ".js"));
                    }
                    var i = 0;
                    function next() {
                        if (i >= vl.packs.length) {
                            return Promise.resolve();
                        }
                        var pack = vl.packs[i];
                        return waits[pack.file].then(function () {
                            return each(pack.name, i);
                        }).then(function () {
                            // The packed text is several megabytes; drop it once decoded
                            if (window.AxionAssets) {
                                delete window.AxionAssets[pack.name];
                            }
                            i++;
                            return next();
                        });
                    }
                    return next();
                };
            })();
        </script>

        <!-- Collision and physics: ground from the terrain, and only nearby objects -->
        <script type="module">
            (function () {
                var vl = window.vl;

                var phys = vl.phys = {
                    ready: false,
                    terrain: null,
                    water: 0,
                    swimDepth: 1.3,      // how deep the feet hang in deep water
                    cell: 16,
                    grid: {},
                    objs: [],
                    near: [],
                    built: {},           // object id -> its triangles, only while close by
                    builtCount: 0,
                    lastX: 1e9,
                    lastZ: 1e9,
                    lastTime: 0,
                    reach: 7,            // objects closer than this (plus their size) get triangles
                    gravity: 20,
                    jump: 5.4,
                    step: 0.5,
                    radius: 0.32,
                    maxSlope: 0.62,      // steepest walkable ground, as the up component of its normal
                    spheres: [0.6, 1.05, 1.45],
                    found: [],
                    plants: [],          // bushes and ferns: no collision, only a rustle
                    plantGrid: {},
                    floorId: -1          // the object stood on, or -1 for the ground
                };

                function key(ix, iz) {
                    return ix * 4096 + iz;
                }

                // One placed object that can be walked into. `model` carries the
                // collider triangles (local space) or, for trees, the trunk radius.
                phys.add = function (x, y, z, yaw, s, model) {
                    var ex = model.extras || {};
                    if (ex.kind === "bush" || /^fern|^shrub/.test(model.name || "")) {
                        var sz = ex.size || [1, 1, 1];
                        phys.plants.push({ x: x, z: z, r: 0.45 * Math.max(sz[0], sz[2]) * s, top: y + sz[1] * s, big: ex.kind === "bush" });
                        return;
                    }
                    var o = {
                        x: x, y: y, z: z, yaw: yaw, s: s, name: model.name || "",
                        trunk: 0, height: 0, col: null, r: 1
                    };
                    if (ex.kind === "tree") {
                        o.trunk = Math.max(ex.trunk || 0.15, 0.08) * s;
                        o.height = (ex.height || 10) * s;
                        o.r = o.trunk;
                    } else if (model.collider) {
                        o.col = model.collider;
                        var size = ex.size || [2, 2, 2];
                        o.r = 0.5 * Math.sqrt(size[0] * size[0] + size[1] * size[1] + size[2] * size[2]) * s;
                    } else {
                        return;
                    }
                    phys.objs.push(o);
                };

                // Spatial index of every object: just positions, built once and cheap
                phys.index = function () {
                    var grid = {};
                    for (var i = 0; i < phys.objs.length; i++) {
                        var o = phys.objs[i];
                        var k = key(Math.floor(o.x / phys.cell), Math.floor(o.z / phys.cell));
                        if (!grid[k]) {
                            grid[k] = [];
                        }
                        grid[k].push(i);
                    }
                    phys.grid = grid;

                    var pg = {};
                    for (i = 0; i < phys.plants.length; i++) {
                        var pl = phys.plants[i];
                        var pk = key(Math.floor(pl.x / 8), Math.floor(pl.z / 8));
                        if (!pg[pk]) {
                            pg[pk] = [];
                        }
                        pg[pk].push(pl);
                    }
                    phys.plantGrid = pg;
                    phys.ready = true;
                };

                // World-space triangles for one object, from its collider mesh
                function build(o) {
                    var pos = o.col.positions;
                    var idx = o.col.indices;
                    var n = idx.length / 3;
                    var tris = new Float32Array(n * 9);
                    var box = new Float32Array(n * 6);
                    var up = new Float32Array(n);
                    var c = Math.cos(o.yaw), sn = Math.sin(o.yaw), s = o.s;
                    var all = [1e9, 1e9, 1e9, -1e9, -1e9, -1e9];
                    var count = 0;

                    for (var t = 0; t < n; t++) {
                        var q = count * 9;
                        for (var k = 0; k < 3; k++) {
                            var v = idx[t * 3 + k] * 3;
                            var lx = pos[v] * s, ly = pos[v + 1] * s, lz = pos[v + 2] * s;
                            // The same rotation the engine applies for a yaw
                            tris[q + k * 3] = o.x + lx * c + lz * sn;
                            tris[q + k * 3 + 1] = o.y + ly;
                            tris[q + k * 3 + 2] = o.z - lx * sn + lz * c;
                        }
                        var ax = tris[q], ay = tris[q + 1], az = tris[q + 2];
                        var bx = tris[q + 3], by = tris[q + 4], bz = tris[q + 5];
                        var cx = tris[q + 6], cy = tris[q + 7], cz = tris[q + 8];
                        var ux = bx - ax, uy = by - ay, uz = bz - az;
                        var wx = cx - ax, wy = cy - ay, wz = cz - az;
                        var nx = uy * wz - uz * wy;
                        var ny = uz * wx - ux * wz;
                        var nz = ux * wy - uy * wx;
                        var len = Math.sqrt(nx * nx + ny * ny + nz * nz);
                        if (len < 1e-9) {
                            continue;
                        }
                        up[count] = ny / len;
                        var b = count * 6;
                        box[b] = Math.min(ax, bx, cx);
                        box[b + 1] = Math.min(ay, by, cy);
                        box[b + 2] = Math.min(az, bz, cz);
                        box[b + 3] = Math.max(ax, bx, cx);
                        box[b + 4] = Math.max(ay, by, cy);
                        box[b + 5] = Math.max(az, bz, cz);
                        for (k = 0; k < 3; k++) {
                            all[k] = Math.min(all[k], box[b + k]);
                            all[k + 3] = Math.max(all[k + 3], box[b + 3 + k]);
                        }
                        count++;
                    }
                    return { tris: tris, box: box, up: up, n: count, all: all };
                }

                /*
                 * Keep a short list of what is near the player, and triangles only
                 * for those. Refreshed after moving a couple of metres or every so
                 * often; objects left behind drop their triangles again.
                 */
                phys.refresh = function (p, force) {
                    var now = performance.now();
                    var moved = Math.abs(p.x - phys.lastX) + Math.abs(p.z - phys.lastZ);
                    if (!force && moved < 1.5 && now - phys.lastTime < 400) {
                        return;
                    }
                    phys.lastX = p.x;
                    phys.lastZ = p.z;
                    phys.lastTime = now;

                    var near = [];
                    var keep = {};
                    var reach = phys.reach;
                    var span = Math.ceil((reach + 30) / phys.cell);
                    var cx = Math.floor(p.x / phys.cell), cz = Math.floor(p.z / phys.cell);
                    for (var ix = cx - span; ix <= cx + span; ix++) {
                        for (var iz = cz - span; iz <= cz + span; iz++) {
                            var list = phys.grid[key(ix, iz)];
                            if (!list) {
                                continue;
                            }
                            for (var i = 0; i < list.length; i++) {
                                var id = list[i];
                                var o = phys.objs[id];
                                var dx = o.x - p.x, dz = o.z - p.z;
                                var d = Math.sqrt(dx * dx + dz * dz);
                                if (d > o.r + reach) {
                                    continue;
                                }
                                near.push(id);
                                if (o.col) {
                                    keep[id] = true;
                                    if (!phys.built[id]) {
                                        phys.built[id] = build(o);
                                        phys.builtCount++;
                                    }
                                }
                            }
                        }
                    }
                    for (var b in phys.built) {
                        if (!keep[b]) {
                            delete phys.built[b];
                            phys.builtCount--;
                        }
                    }
                    phys.near = near;

                    var tris = 0;
                    for (b in phys.built) {
                        tris += phys.built[b].n;
                    }
                    vl.status("ready · " + near.length + " objects near, " + tris + " triangles");
                };

                // How deep into a bush or fern the point x, z is (0 = not in one)
                phys.inPlant = function (x, y, z) {
                    var cx = Math.floor(x / 8), cz = Math.floor(z / 8);
                    var most = 0;
                    for (var ix = cx - 1; ix <= cx + 1; ix++) {
                        for (var iz = cz - 1; iz <= cz + 1; iz++) {
                            var list = phys.plantGrid[key(ix, iz)];
                            if (!list) {
                                continue;
                            }
                            for (var i = 0; i < list.length; i++) {
                                var pl = list[i];
                                if (y > pl.top + 0.2) {
                                    continue;
                                }
                                var dx = x - pl.x, dz = z - pl.z;
                                var d = Math.sqrt(dx * dx + dz * dz);
                                if (d < pl.r) {
                                    most = Math.max(most, (1 - d / pl.r) * (pl.big ? 1 : 0.6));
                                }
                            }
                        }
                    }
                    return most;
                };

                // Highest walkable surface under x, z at or below `top`
                phys.floor = function (x, top, z) {
                    phys.floorId = -1;
                    var best = phys.terrain.heightAt(x, z);
                    var swim = phys.water - phys.swimDepth;
                    if (best < swim) {
                        best = swim;
                    }
                    for (var id in phys.built) {
                        var c = phys.built[id];
                        var A = c.all;
                        if (x < A[0] || x > A[3] || z < A[2] || z > A[5] || A[1] > top) {
                            continue;
                        }
                        var T = c.tris, B = c.box;
                        for (var t = 0; t < c.n; t++) {
                            if (c.up[t] < 0.5) {
                                continue;
                            }
                            var b = t * 6;
                            if (x < B[b] || x > B[b + 3] || z < B[b + 2] || z > B[b + 5] || B[b + 1] > top) {
                                continue;
                            }
                            var o = t * 9;
                            var ax = T[o], ay = T[o + 1], az = T[o + 2];
                            var bx = T[o + 3], by = T[o + 4], bz = T[o + 5];
                            var cx = T[o + 6], cy = T[o + 7], cz = T[o + 8];
                            var d = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);
                            if (Math.abs(d) < 1e-12) {
                                continue;
                            }
                            var w1 = ((bz - cz) * (x - cx) + (cx - bx) * (z - cz)) / d;
                            var w2 = ((cz - az) * (x - cx) + (ax - cx) * (z - cz)) / d;
                            var w3 = 1 - w1 - w2;
                            if (w1 < 0 || w2 < 0 || w3 < 0) {
                                continue;
                            }
                            var y = w1 * ay + w2 * by + w3 * cy;
                            if (y <= top && y > best) {
                                best = y;
                                phys.floorId = +id;
                            }
                        }
                    }
                    return best;
                };

                // Closest point on a triangle to p (Ericson, Real-Time Collision Detection)
                var hit = [0, 0, 0];
                function closest(px, py, pz, T, o) {
                    var ax = T[o], ay = T[o + 1], az = T[o + 2];
                    var bx = T[o + 3], by = T[o + 4], bz = T[o + 5];
                    var cx = T[o + 6], cy = T[o + 7], cz = T[o + 8];

                    var abx = bx - ax, aby = by - ay, abz = bz - az;
                    var acx = cx - ax, acy = cy - ay, acz = cz - az;
                    var apx = px - ax, apy = py - ay, apz = pz - az;

                    var d1 = abx * apx + aby * apy + abz * apz;
                    var d2 = acx * apx + acy * apy + acz * apz;
                    if (d1 <= 0 && d2 <= 0) {
                        hit[0] = ax; hit[1] = ay; hit[2] = az;
                        return;
                    }

                    var bpx = px - bx, bpy = py - by, bpz = pz - bz;
                    var d3 = abx * bpx + aby * bpy + abz * bpz;
                    var d4 = acx * bpx + acy * bpy + acz * bpz;
                    if (d3 >= 0 && d4 <= d3) {
                        hit[0] = bx; hit[1] = by; hit[2] = bz;
                        return;
                    }

                    var vc = d1 * d4 - d3 * d2;
                    if (vc <= 0 && d1 >= 0 && d3 <= 0) {
                        var v = d1 / (d1 - d3);
                        hit[0] = ax + abx * v; hit[1] = ay + aby * v; hit[2] = az + abz * v;
                        return;
                    }

                    var cpx = px - cx, cpy = py - cy, cpz = pz - cz;
                    var d5 = abx * cpx + aby * cpy + abz * cpz;
                    var d6 = acx * cpx + acy * cpy + acz * cpz;
                    if (d6 >= 0 && d5 <= d6) {
                        hit[0] = cx; hit[1] = cy; hit[2] = cz;
                        return;
                    }

                    var vb = d5 * d2 - d1 * d6;
                    if (vb <= 0 && d2 >= 0 && d6 <= 0) {
                        var w = d2 / (d2 - d6);
                        hit[0] = ax + acx * w; hit[1] = ay + acy * w; hit[2] = az + acz * w;
                        return;
                    }

                    var va = d3 * d6 - d5 * d4;
                    if (va <= 0 && d4 - d3 >= 0 && d5 - d6 >= 0) {
                        var e = (d4 - d3) / ((d4 - d3) + (d5 - d6));
                        hit[0] = bx + (cx - bx) * e; hit[1] = by + (cy - by) * e; hit[2] = bz + (cz - bz) * e;
                        return;
                    }

                    var inv = 1 / (va + vb + vc);
                    var sv = vb * inv;
                    var sw = vc * inv;
                    hit[0] = ax + abx * sv + acx * sw;
                    hit[1] = ay + aby * sv + acy * sw;
                    hit[2] = az + abz * sv + acz * sw;
                }

                // Slide along a wall instead of into it
                function slide(p, nx, nz) {
                    var into = p.vx * nx + p.vz * nz;
                    if (into < 0) {
                        p.vx -= nx * into;
                        p.vz -= nz * into;
                    }
                }

                // Push the body out of tree trunks and nearby triangles
                function pushOut(p) {
                    var r = phys.radius;

                    // Trunks: upright cylinders
                    for (var i = 0; i < phys.near.length; i++) {
                        var o = phys.objs[phys.near[i]];
                        if (!o.trunk || p.y > o.y + o.height || p.y + 1.7 < o.y) {
                            continue;
                        }
                        var dx = p.x - o.x, dz = p.z - o.z;
                        var min = o.trunk + r;
                        var d2 = dx * dx + dz * dz;
                        if (d2 >= min * min || d2 < 1e-10) {
                            continue;
                        }
                        var d = Math.sqrt(d2);
                        p.x = o.x + dx / d * min;
                        p.z = o.z + dz / d * min;
                        slide(p, dx / d, dz / d);
                    }

                    // Rocks, logs, props and buildings: spheres against triangles
                    for (var pass = 0; pass < 2; pass++) {
                        for (var id in phys.built) {
                            var c = phys.built[id];
                            var A = c.all;
                            if (p.x + r < A[0] || p.x - r > A[3] || p.z + r < A[2] || p.z - r > A[5]) {
                                continue;
                            }
                            if (p.y + 1.8 < A[1] || p.y > A[4]) {
                                continue;
                            }
                            var T = c.tris, B = c.box;
                            for (var s = 0; s < phys.spheres.length; s++) {
                                var cy = p.y + phys.spheres[s];
                                for (var t = 0; t < c.n; t++) {
                                    var b = t * 6;
                                    if (p.x + r < B[b] || p.x - r > B[b + 3]) { continue; }
                                    if (cy + r < B[b + 1] || cy - r > B[b + 4]) { continue; }
                                    if (p.z + r < B[b + 2] || p.z - r > B[b + 5]) { continue; }

                                    closest(p.x, cy, p.z, T, t * 9);
                                    var hx = p.x - hit[0], hy = cy - hit[1], hz = p.z - hit[2];
                                    var h2 = hx * hx + hy * hy + hz * hz;
                                    if (h2 >= r * r || h2 < 1e-12) {
                                        continue;
                                    }
                                    // Floors under the body are the ground check's job
                                    if (c.up[t] > 0.7 && hit[1] < cy) {
                                        continue;
                                    }
                                    var hd = Math.sqrt(h2);
                                    var push = r - hd;
                                    var nx = hx / hd, ny = hy / hd, nz = hz / hd;
                                    p.x += nx * push;
                                    p.z += nz * push;
                                    if (ny < -0.5) {
                                        p.y += ny * push;
                                        if (p.vy > 0) {
                                            p.vy = 0;
                                        }
                                    }
                                    slide(p, nx, nz);
                                }
                            }
                        }
                    }
                }

                // One physics step for a walking body p (feet position)
                phys.walk = function (p, wishX, wishZ, jump, dt) {
                    var grip = p.ground ? 12 : (p.swim ? 4 : 2);
                    var ease = 1 - Math.exp(-grip * dt);
                    p.vx += (wishX - p.vx) * ease;
                    p.vz += (wishZ - p.vz) * ease;

                    if (jump && p.ground && !p.swim) {
                        p.vy = phys.jump;
                        p.ground = false;
                    }

                    var ox = p.x, oz = p.z;
                    p.x += p.vx * dt;
                    p.z += p.vz * dt;

                    // Too steep to climb: the move is undone, going down is fine
                    var t = phys.terrain;
                    var hNew = t.heightAt(p.x, p.z);
                    if (p.ground && hNew > p.y + 0.02) {
                        var n = t.normalAt(p.x, p.z);
                        if (n[1] < phys.maxSlope) {
                            p.x = ox;
                            p.z = oz;
                            slide(p, n[0], n[2]);
                        }
                    }

                    pushOut(p);

                    var wasGround = p.ground;
                    p.vy -= phys.gravity * dt;
                    var floor = phys.floor(p.x, p.y + phys.step, p.z);
                    p.y += p.vy * dt;
                    p.swim = floor <= phys.water - phys.swimDepth + 0.01 && t.heightAt(p.x, p.z) < floor;

                    if (p.y <= floor) {
                        p.y = floor;
                        p.vy = 0;
                        p.ground = true;
                    } else if (wasGround && p.vy <= 0 && p.y - floor < phys.step) {
                        // Stick to the ground going down slopes and steps
                        p.y = floor;
                        p.vy = 0;
                        p.ground = true;
                    } else {
                        p.ground = false;
                    }
                };
            })();
        </script>

        <!-- Camera -->
        <script type="module">
            (function () {
                var vl = window.vl;
                var cam = vl.cam;

                vl.setMode = function (mode) {
                    if (mode === cam.mode) {
                        return;
                    }
                    if (mode === "walk") {
                        cam.y -= cam.eye;      // eye to feet
                        cam.eyeY = cam.y + cam.eye;
                    } else {
                        cam.y = cam.eyeY;      // feet to eye
                    }
                    cam.vx = 0;
                    cam.vy = 0;
                    cam.vz = 0;
                    cam.ground = false;
                    cam.mode = mode;
                    vl.hint();
                };

                function fly(dt, fx, fy, fz, rx, rz) {
                    var k = cam.keys;
                    var mx = 0;
                    var my = 0;
                    var mz = 0;

                    if (k.KeyW) { mx += fx; my += fy; mz += fz; }
                    if (k.KeyS) { mx -= fx; my -= fy; mz -= fz; }
                    if (k.KeyD) { mx += rx; mz += rz; }
                    if (k.KeyA) { mx -= rx; mz -= rz; }
                    if (k.Space) { my += 1; }
                    if (k.ShiftLeft || k.ShiftRight) { my -= 1; }

                    var len = Math.sqrt(mx * mx + my * my + mz * mz);
                    var speed = cam.flySpeed;
                    if (k.KeyQ) {
                        speed *= 4;
                    }
                    if (len > 0) {
                        mx = mx / len * speed;
                        my = my / len * speed;
                        mz = mz / len * speed;
                    }

                    // Ease the velocity so starts and stops are smooth
                    var ease = 1 - Math.exp(-8 * dt);
                    cam.vx += (mx - cam.vx) * ease;
                    cam.vy += (my - cam.vy) * ease;
                    cam.vz += (mz - cam.vz) * ease;

                    cam.x += cam.vx * dt;
                    cam.y += cam.vy * dt;
                    cam.z += cam.vz * dt;

                    // Stay above the ground and the water
                    var t = vl.phys.terrain;
                    if (t) {
                        var low = Math.max(t.heightAt(cam.x, cam.z), vl.phys.water) + 0.6;
                        if (cam.y < low) {
                            cam.y = low;
                            if (cam.vy < 0) {
                                cam.vy = 0;
                            }
                        }
                    }
                    cam.eyeY = cam.y;
                }

                function walk(dt, rx, rz) {
                    var k = cam.keys;

                    // Flat forward, so looking up or down doesn't change walking speed
                    var fx = -Math.sin(cam.yaw);
                    var fz = -Math.cos(cam.yaw);
                    var mx = 0;
                    var mz = 0;

                    if (k.KeyW) { mx += fx; mz += fz; }
                    if (k.KeyS) { mx -= fx; mz -= fz; }
                    if (k.KeyD) { mx += rx; mz += rz; }
                    if (k.KeyA) { mx -= rx; mz -= rz; }

                    var len = Math.sqrt(mx * mx + mz * mz);
                    var speed = cam.walkSpeed;
                    if (k.ShiftLeft || k.ShiftRight) {
                        speed *= 2;
                    }
                    if (cam.swim) {
                        speed *= 0.45;
                    }
                    if (len > 0) {
                        mx = mx / len * speed;
                        mz = mz / len * speed;
                    }

                    // Jump once per press
                    var jump = k.Space && !cam.jumpHeld;
                    cam.jumpHeld = !!k.Space;

                    vl.phys.refresh(cam);
                    var airborne = !cam.ground && !cam.swim;
                    var fallSpeed = -cam.vy;

                    // Small fixed steps so fast falls can't pass through floors
                    var steps = Math.min(12, Math.ceil(dt / (1 / 120)));
                    var h = dt / steps;
                    for (var i = 0; i < steps; i++) {
                        vl.phys.walk(cam, mx, mz, jump && i === 0, h);
                    }

                    // Somehow under the ground: back on top of it
                    var t = vl.phys.terrain;
                    var ground = t.heightAt(cam.x, cam.z);
                    if (cam.y < ground - 3) {
                        cam.y = ground;
                        cam.vy = 0;
                    }

                    // A hard enough landing is heard
                    if (airborne && cam.ground && fallSpeed > 3) {
                        cam.landed = Math.min(1, (fallSpeed - 3) / 8 + 0.3);
                    }

                    // Head bob while walking on land
                    var moving = Math.sqrt(cam.vx * cam.vx + cam.vz * cam.vz);
                    var stepBefore = Math.floor(cam.bob / Math.PI);
                    if (cam.ground && !cam.swim && moving > 0.5) {
                        cam.bob += dt * moving * 2.1;
                    } else {
                        cam.bob *= Math.exp(-6 * dt);
                    }
                    // One footstep per half cycle of the bob; strokes while swimming
                    if (Math.floor(cam.bob / Math.PI) !== stepBefore && cam.ground && moving > 0.5) {
                        cam.stepped = true;
                    }
                    if (cam.swim && moving > 0.4) {
                        cam.stroke = (cam.stroke || 0) + dt * moving * 0.9;
                        if (cam.stroke > 1) {
                            cam.stroke = 0;
                            cam.stepped = true;
                        }
                    }
                    var bob = Math.sin(cam.bob) * 0.035 * Math.min(1, moving / 3);

                    // Smooth the eye over steps; follow jumps and falls directly.
                    // Swimming keeps the eye just above the surface.
                    var target = cam.y + (cam.swim ? cam.swimEye : cam.eye) + bob;
                    if (cam.ground || cam.swim) {
                        cam.eyeY += (target - cam.eyeY) * (1 - Math.exp(-14 * dt));
                    } else {
                        cam.eyeY = target;
                    }
                }

                // Keep the player on the map
                function clampToMap() {
                    var lim = vl.mapHalf - 12;
                    if (cam.x < -lim) { cam.x = -lim; cam.vx = 0; }
                    if (cam.x > lim) { cam.x = lim; cam.vx = 0; }
                    if (cam.z < -lim) { cam.z = -lim; cam.vz = 0; }
                    if (cam.z > lim) { cam.z = lim; cam.vz = 0; }
                }

                vl.moveCam = function (app, dt) {
                    var cp = Math.cos(cam.pitch);
                    var sp = Math.sin(cam.pitch);
                    var cy = Math.cos(cam.yaw);
                    var sy = Math.sin(cam.yaw);

                    // Look direction and right direction
                    var fx = -sy * cp;
                    var fy = sp;
                    var fz = -cy * cp;
                    var rx = cy;
                    var rz = -sy;

                    if (cam.mode === "walk") {
                        walk(dt, rx, rz);
                    } else {
                        fly(dt, fx, fy, fz, rx, rz);
                    }
                    clampToMap();

                    var ex = cam.x;
                    var ey = cam.eyeY;
                    var ez = cam.z;
                    app.camera.position.set([ex, ey, ez]);
                    app.camera.target.set([ex + fx, ey + fy, ez + fz]);
                    app.camera.update();
                };
            })();
        </script>

        <!-- Fullscreen -->
        <script type="module">
            (function () {
                var vl = window.vl;
                var full = vl.full = {
                    // True in the copy of the page opened in its own tab
                    popped: !!window.vlPopped,
                    tab: null
                };

                function isFull() {
                    return !!(document.fullscreenElement || document.webkitFullscreenElement);
                }

                function enter(onFail) {
                    var el = document.documentElement;
                    var req = el.requestFullscreen || el.webkitRequestFullscreen;
                    var allowed = document.fullscreenEnabled || document.webkitFullscreenEnabled;
                    if (!req || !allowed) {
                        onFail();
                        return;
                    }
                    try {
                        var p = req.call(el);
                        if (p && p.catch) {
                            p.catch(onFail);
                        }
                    } catch (e) {
                        onFail();
                    }
                }

                function leave() {
                    var exit = document.exitFullscreen || document.webkitExitFullscreen;
                    if (exit) {
                        exit.call(document);
                    }
                }

                // Khan Academy's frame doesn't allow fullscreen, so open this page
                // in its own tab, where it can go fullscreen for real.
                function popOut() {
                    if (window.top === window) {
                        vl.msg.textContent = "The browser blocked fullscreen here. Press F11 instead.";
                        return;
                    }

                    var w = null;
                    try {
                        w = window.open("", "_blank");
                    } catch (e) {
                        w = null;
                    }
                    if (!w) {
                        vl.msg.textContent = "Couldn't open a new tab (popups blocked). Allow popups, or press F11.";
                        return;
                    }

                    var html = vl.pageHtml;
                    // The tag is split in two so no page tool can mistake it for the end of this script
                    var tag = "scr" + "ipt";
                    html = html.replace("<head>", "<head><" + tag + ">window.vlPopped = true;</" + tag + ">");
                    try {
                        w.document.open();
                        w.document.write(html);
                        w.document.close();
                    } catch (e) {
                        w.close();
                        vl.msg.textContent = "Couldn't open the fullscreen tab here. Press F11 instead.";
                        return;
                    }

                    // Two copies rendering at once is too much: pause this one until the tab closes
                    full.tab = w;
                    if (vl.app) {
                        vl.app.stop();
                    }
                    vl.msg.textContent = "Running in the new tab. Close it to come back here.";
                    if (!vl.ready) {
                        vl.progress("Running in the new tab. Close it to come back here.");
                    }
                    var watch = setInterval(function () {
                        if (!w.closed) {
                            return;
                        }
                        clearInterval(watch);
                        full.tab = null;
                        if (vl.app && vl.ready) {
                            vl.app.start();
                        }
                        vl.hint();
                    }, 500);
                }

                /*
                 * Inside Khan Academy's frame, fullscreen is refused, and asking for
                 * it first uses up the click: by the time the refusal arrives the
                 * browser no longer lets the page open a tab. So in a frame the
                 * tab is opened straight away, while the click still counts.
                 */
                full.toggle = function () {
                    if (isFull()) {
                        leave();
                        return;
                    }
                    if (window.top !== window) {
                        popOut();
                        return;
                    }
                    enter(function () {
                        vl.msg.textContent = "The browser blocked fullscreen. Press F11 instead.";
                    });
                };

                // The button on the loading screen works before the world is in
                var early = document.getElementById("loadFull");
                if (early) {
                    if (full.popped) {
                        early.style.display = "none";
                    }
                    early.onclick = function () {
                        full.toggle();
                    };
                }

                // In the popped-out tab: one click to go fullscreen
                // (browsers only allow it right after a click)
                full.prompt = function () {
                    var b = document.createElement("button");
                    b.className = "btn";
                    b.textContent = "Click for fullscreen";
                    b.style.position = "fixed";
                    b.style.left = "50%";
                    b.style.top = "50%";
                    b.style.width = "220px";
                    b.style.marginLeft = "-110px";
                    b.style.zIndex = "5";
                    b.style.fontSize = "15px";
                    b.onclick = function () {
                        b.parentNode.removeChild(b);
                        enter(function () {
                            vl.msg.textContent = "The browser blocked fullscreen. Press F11 instead.";
                        });
                    };
                    document.body.appendChild(b);
                };

                full.isFull = isFull;
                full.enter = enter;
            })();
        </script>

        <!-- Menu -->
        <script type="module">
            (function () {
                var vl = window.vl;
                var cam = vl.cam;
                var list = vl.list;
                var panel = vl.panel;

                var scroll = vl.scroll = {
                    bar: document.getElementById("bar"),
                    thumb: document.getElementById("thumb"),
                    timer: 0,
                    grab: null
                };

                scroll.update = function () {
                    var view = list.clientHeight;
                    var full = list.scrollHeight;
                    var track = scroll.bar.clientHeight;

                    if (full <= view + 1) {
                        scroll.bar.classList.add("hide");
                        return;
                    }
                    scroll.bar.classList.remove("hide");

                    var size = Math.max(24, track * view / full);
                    var room = track - size;
                    var pos = room * list.scrollTop / (full - view);

                    scroll.thumb.style.height = size + "px";
                    scroll.thumb.style.top = pos + "px";
                };

                list.addEventListener("scroll", function () {
                    scroll.update();
                    scroll.bar.classList.add("active");
                    clearTimeout(scroll.timer);
                    scroll.timer = setTimeout(function () {
                        scroll.bar.classList.remove("active");
                    }, 1000);
                });

                window.addEventListener("resize", scroll.update);

                scroll.thumb.addEventListener("mousedown", function (e) {
                    scroll.grab = { y: e.clientY, top: list.scrollTop };
                    e.preventDefault();
                });

                window.addEventListener("mousemove", function (e) {
                    if (!scroll.grab) {
                        return;
                    }
                    var view = list.clientHeight;
                    var full = list.scrollHeight;
                    var room = scroll.bar.clientHeight - scroll.thumb.offsetHeight;
                    var dy = e.clientY - scroll.grab.y;
                    list.scrollTop = scroll.grab.top + dy * (full - view) / room;
                });

                window.addEventListener("mouseup", function () {
                    scroll.grab = null;
                });

                // Clicking the empty track jumps a page
                scroll.bar.addEventListener("mousedown", function (e) {
                    if (e.target !== scroll.bar) {
                        return;
                    }
                    var thumbTop = scroll.thumb.getBoundingClientRect().top;
                    var page = list.clientHeight * 0.9;
                    list.scrollTop += e.clientY < thumbTop ? -page : page;
                });

                document.getElementById("tab").onclick = function () {
                    panel.classList.toggle("open");
                    scroll.update();
                };

                // Don't let menu buttons and checkboxes keep keyboard focus: a focused
                // button swallows Space and its keys never reach the camera
                panel.addEventListener("click", function (e) {
                    var t = e.target;
                    if (t.tagName === "BUTTON" || (t.tagName === "INPUT" && t.type === "checkbox")) {
                        t.blur();
                    }
                });

                // Quality levels: what each one sets
                vl.presets = {
                    low: {
                        dpr: 0.75, lodBias: 0.55, grass: 24, blades: 256, grassDensity: 1,
                        shadowSize: 1024, shadowDistance: 110, ssr: 0, ssrSteps: 16, ao: 0,
                        volumetric: false, cloudShadows: true
                    },
                    medium: {

                    function section(title, open) {

                        head.className = "sec-head";

                        row.appendChild(input);

                        row.appendChild(sel);

                        defaults.push(function () {
                            sel.value = start;
                            set(start);
                        });
                        syncs.push(function () {
                            sel.value = String(get());

                        b.className = "btn";
                        b.textContent = label;
                        b.onclick = onClick;

                    choice("Preset", [
                        ["low", "Low"], ["medium", "Medium"], ["high", "High"], ["ultra", "Ultra"]
                    ],

                    slider("Resolution scale", 0.5, 2, 0.25,

                    slider("Detail distance", 0.3, 2.5, 0.05,
                        function () { return r.lodBias; },

                    slider("Grass distance (m)", 0, 120, 1,
                        function () { return t.grass.radius; },

                    slider("Grass blades (per 4 m tile)", 64, 1536, 32,

                    choice("Sun shadow resolution", [

                        function () { return r.sun.shadows.size; },
                        function (v) { r.sun.shadows.size = Number(v); });
                    slider("Sun shadow distance (m)", 60, 500, 10,
                        function () { return r.sun.shadows.distance; },
                        function (v) { r.sun.shadows.distance = v; });
                    toggle("Anti-aliasing (FXAA)",
                        function () { return r.fxaa; },
                        function (v) { r.fxaa = v; });
                    toggle("Show stats",
                        function () { return vl.showStats; },
                        function (v) {

                    section("Window");
                    var fsBtn = button("Fullscreen", function () {

                    function showFull() {
                        fsBtn.textContent = vl.full.isFull() ? "Exit fullscreen" : "Fullscreen";
                    }
                    document.addEventListener("fullscreenchange", showFull);
                    document.addEventListener("webkitfullscreenchange", showFull);
                    slider("Field of view", 45, 100, 1,
                        function () { return Math.round(app.camera.fov * 180 / Math.PI); },
                        function (v) { app.camera.fov = v * Math.PI / 180; app.camera.update(); });

                    section("Movement");
                    var modeBtn = button("", function () {
                        vl.setMode(cam.mode === "walk" ? "fly" : "walk");
                        showMode();

                    function showMode() {
                        modeBtn.textContent = cam.mode === "walk" ? "Mode: First person (walk)" : "Mode: Fly";
                    }
                    vl.showMode = showMode;
                    showMode();
                    button("Back to the start", function () {

                    button("Go to the fort", function () {

                    slider("Walk speed", 1, 10, 0.1,
                        function () { return cam.walkSpeed; },
                        function (v) { cam.walkSpeed = v; });
                    slider("Fly speed", 2, 60, 1,
                        function () { return cam.flySpeed; },

                    slider("Jump power", 2, 10, 0.1,

                    section("Sound", true);
                    slider("Volume", 0, 1.5, 0.05,
                        function () { return window.ValleySound ? ValleySound.volume : 0.8; },
                        function (v) {
                            if (window.ValleySound) {
                                ValleySound.setVolume(v);
                            }
                        });

                    // The time of day only as a readout; it runs on its own
                    var clock = document.createElement("div");
                    clock.className = "info";
                    list.appendChild(clock);
                    function showClock() {
                        var h = world.day.hour;
                        var hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
                        clock.textContent = "Time in the valley " + (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
                    }
                    setInterval(showClock, 1000);
                    showClock();

                    // One reset for everything, outside the sections
                    button("Reset settings", function () {
                        for (var i = 0; i < defaults.length; i++) {

        <!-- The world: terrain, forest, rocks, camp and fort -->
        <script type="module">
            (function () {
                var vl = window.vl;
                var cam = vl.cam;
                var msg = vl.msg;

                // A clean copy of the page (nothing loaded yet) for the fullscreen tab
                // A copy of the page (nothing loaded yet) for the fullscreen tab. The
                // scripts are modules, which the host leaves as they are, so the
                // copy runs the same as the original.
                vl.pageHtml = "<!DOCTYPE html>" + document.documentElement.outerHTML;

                var world = vl.world = {
                    map: null,
                    fire: 1,
                    lights: [],
                    placed: 0,
                    // Time of day in hours; it always runs. Sunrise is at 6, sunset at 18.
                    day: {
                        hour: 10,
                        minutes: 24,      // real minutes for one whole day
                        elevation: 0,
                        azimuth: 0
                    },
                    // Fog the menu sets; the morning mist is added on top of it
                    fog: {
                        density: 0.0006,
                        falloff: 0.009,
                        shafts: 0.0016,
                        mist: 1
                    }
                };

                if (!navigator.gpu) {
                    vl.progress("This browser doesn't support WebGPU.");
                    return;
                }
                if (!window.Axion) {
                    vl.progress("Couldn't load the engine from jsDelivr.");
                    return;
                }

                // Reads the map container: a small header, JSON, then binary sections
                function readMap(buf) {
                    var dv = new DataView(buf);
                    if (dv.getUint32(0, true) !== 0x504d5841) {
                        throw new Error("the map pack is damaged");
                    }
                    var len = dv.getUint32(4, true);
                    var meta = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 8, len)));
                    var start = 8 + len;
                    start += (4 - start % 4) % 4;

                    meta.bytes = function (r) {
                        return new Uint8Array(buf, start + r[0], r[1]);
                    };
                    meta.floats = function (r) {
                        return new Float32Array(buf, start + r[0], r[1] / 4);
                    };

                    // Heights are stored as 16-bit steps between the lowest and highest point
                    var q = new Uint16Array(buf, start + meta.heights[0], meta.heights[1] / 2);
                    var h = new Float32Array(q.length);
                    var lo = meta.heightMin;
                    var k = (meta.heightMax - meta.heightMin) / 65535;
                    for (var i = 0; i < q.length; i++) {
                        h[i] = lo + q[i] * k;
                    }
                    meta.heightData = h;
                    return meta;
                }

                function image(bytes) {
                    return createImageBitmap(new Blob([bytes], { type: "image/webp" }));
                }

                function buildTerrain(app, map) {
                    var jobs = [];
                    for (var i = 0; i < map.layers.length; i++) {
                        jobs.push(image(map.bytes(map.layers[i].albedo)));
                        jobs.push(image(map.bytes(map.layers[i].normal)));
                    }
                    // Small colour corrections so the layers sit together
                    var tints = [
                        [0.92, 0.97, 0.86],
                        [0.7, 0.66, 0.6],
                        [1, 0.96, 0.92],
                        [0.95, 0.95, 0.95],
                        [0.92, 0.94, 0.96]
                    ];
                    return Promise.all(jobs).then(function (imgs) {
                        var layers = [];
                        for (var i = 0; i < map.layers.length; i++) {
                            var l = map.layers[i];
                            layers.push({
                                albedo: imgs[i * 2],
                                normal: imgs[i * 2 + 1],
                                scale: l.scale,
                                roughness: l.roughness,
                                // Rock wraps around cliffs instead of stretching down them
                                triplanar: i === 4,
                                tint: tints[i]

                        }

                        // Layers: 0 forest floor, 1 fallen needles, 2 trail, 3 shore sand, 4 rock
                        var terrain = app.terrain({
                            heights: map.heightData,
                            size: map.size,
                            grid: 32,
                            layers: layers,
                            layerSize: 1024,
                            splat: { data: map.bytes(map.splat), size: map.splatSize },
                            rock: { layer: 4, slope: [0.42, 0.62], strength: 1 },
                            snow: { height: [215, 280], slope: 0.5 },
                            shore: { layer: 3, height: 1.4, darken: 0.4 },
                            macro: { variation: 0.4, scale: 0.01 },
                            water: {
                                level: map.water,
                                deep: [0.012, 0.04, 0.05],
                                shallow: [0.09, 0.14, 0.1],
                                clarity: 0.85,
                                waves: 0.6
                            },
                            grass: {
                                radius: 55,
                                height: 0.42,
                                width: 0.05,
                                density: 1,
                                bladesPerTile: 640,
                                forest: 0.03,
                                maxSlope: 0.5,
                                base: [0.11, 0.19, 0.045],
                                tip: [0.4, 0.52, 0.17],
                                flowers: 0.02,
                                dry: 0.55
                            }
                        });

                        for (i = 0; i < imgs.length; i++) {
                            imgs[i].close();
                        }
                        return terrain;
                    });
                }

                // Puts every copy of each model from the map into the world
                function placeModels(app, models) {
                    var map = world.map;
                    for (var name in models) {
                        var range = map.placements[name];
                        if (!range) {
                            continue;
                        }
                        var model = models[name];
                        var list = map.floats(range);
                        world.placed += app.place(model, list);

                        // Anything with a trunk or a collider can be bumped into
                        for (var i = 0; i + 4 < list.length; i += 5) {
                            vl.phys.add(list[i], list[i + 1], list[i + 2], list[i + 3], list[i + 4], model);
                        }

                }

                // Firelight: a warm point light that flickers, and glowing embers
                function addLights(app) {
                    var r = app.renderer;
                    var ember = app.material({
                        name: "embers", color: [1, 0.42, 0.12], emissive: 7,
                        roughness: 1, castShadow: false
                    });
                    var flame = app.material({
                        name: "flame", color: [1, 0.62, 0.22], emissive: 12,
                        roughness: 1, castShadow: false
                    });
                    var ball = app.mesh(Axion.icosphere(0.5, 2));

                    var list = world.map.lights;
                    for (var i = 0; i < list.length; i++) {
                        var l = list[i];
                        var e = app.light(l.pos, { color: l.color, intensity: l.intensity, range: l.range });
                        world.lights.push({ e: e, base: l.intensity, fire: !!l.fire, seed: i * 17.3 });
                        if (!l.fire) {
                            continue;
                        }
                        var x = l.pos[0], y = l.pos[1] - 0.8, z = l.pos[2];
                        app.add({ mesh: ball, material: ember, position: [x, y + 0.12, z], scale: [0.75, 0.16, 0.75] });
                        app.add({ mesh: ball, material: flame, position: [x, y + 0.34, z], scale: [0.34, 0.5, 0.34] });
                        app.add({ mesh: ball, material: flame, position: [x + 0.12, y + 0.3, z - 0.08], scale: [0.2, 0.38, 0.2] });
                    }
                    r.shadows.maxLights = 2;
                }

                function flicker(app) {
                    var t = app.time;
                    for (var i = 0; i < world.lights.length; i++) {
                        var l = world.lights[i];
                        var c = app.world.get(l.e, Axion.PointLight);
                        var k = 1;
                        if (l.fire) {
                            var s = l.seed;
                            k = 0.82 + 0.1 * Math.sin(t * 9.1 + s) + 0.06 * Math.sin(t * 23.7 + s * 2)
                                + 0.05 * Math.sin(t * 4.3 + s * 3) + 0.04 * (Math.random() - 0.5);
                        }
                        // PointLight data is [r, g, b, intensity, range]
                        c.array[c.offset + 3] = l.base * k * world.fire;
                    }
                }

                // Time of day
                /*
                 * The sun's path for an hour of the day: it rises in the east (+x)
                 * at 6, is highest in the south (+z) at noon and sets in the west
                 * at 18. At night the engine lights the world by the moon.
                 */
                world.sunAt = function (hour) {
                    var a = (hour - 6) / 24 * Math.PI * 2;
                    world.day.elevation = 6 + 52 * Math.sin(a);
                    world.day.azimuth = ((hour - 6) / 24 * 360 + 360) % 360;
                };

                    world.sunAt(d.hour);
                    vl.app.renderer.setSunAngles(d.elevation, d.azimuth);

                    var d = Math.abs(h - 6.6);

                    var eve = Math.max(0, Math.min(1, (h - 20) / 1.5));
                    var dawn = Math.max(0, Math.min(1, (5.5 - h) / 1.5));
                    var n = Math.max(eve, dawn);
                    var night = 0.35 * n * n * (3 - 2 * n);
                    var mist = Math.max(morning, night) * f.mist;
                    r.fogDensity = f.density + mist * 0.009;
                    r.fogHeight.falloff = f.falloff + mist * 0.05;

                function moveSun(dt) {
                    var d = world.day;
                    d.hour = (d.hour + dt * 24 / (d.minutes * 60)) % 24;

                world.toSpawn = function () {
                    var s = world.map.spawn;
                    var look = s.look || [s.x, s.z - 100];
                    place(s.x, s.z, yawTo(s.x, s.z, look[0], look[1]));

                world.toFort = function () {
                    var f = world.map.fort;
                    // On the path outside the gate, looking in

                // Sound: what the listener hears depends on where they are
                var ear = { waterTimer: 0, water: 0, waterX: 0, waterZ: 0, fires: null, treeTimer: 0, trees: [] };
                function listen(app, dt) {
                    var snd = window.ValleySound;
                    if (!snd || !snd.on) {

                    }

                    // The nearest water, looked for in rings a few times a second
                    ear.waterTimer -= dt;
                    if (ear.waterTimer <= 0) {

                        var best = 1e9;

                        for (var r = 0; r < rings.length && best > 1e8; r++) {
