                    var speed = Math.sqrt(cam.vx * cam.vx + cam.vz * cam.vz);
                    var brush = 0;
                    ear.brushTimer = (ear.brushTimer || 0) - dt;
                    if (cam.mode === "walk" && speed > 0.6 && ear.brushTimer <= 0) {
                        var depth = vl.phys.inPlant(cam.x, cam.y, cam.z);
                        if (depth > 0.05) {
                            brush = Math.min(1, depth * 0.6 + speed / 7);
                            ear.brushTimer = 0.9 / Math.min(2, speed / 2 + 0.4);
                        }
                    }

                    snd.update({
                        dt: dt,
                        x: cam.x,
                        y: cam.eyeY,
                        z: cam.z,
                        yaw: cam.yaw,
                        daylight: Math.max(0, Math.min(1, (world.day.elevation + 4) / 12)),
                        height: Math.max(0, cam.eyeY - 6),
                        forest: Math.min(1, trunks / 5),
                        trees: ear.trees,
                        water: ear.water,
                        waterX: ear.waterX,
                        waterZ: ear.waterZ,
                        fires: ear.fires,
                        above: cam.eyeY - Math.max(ground, vl.phys.water),
                        brush: brush,
                        step: cam.mode === "walk" && cam.stepped,
                        surface: surface,
                        land: cam.mode === "walk" ? (cam.landed || 0) : 0,
                        wind: app.renderer.wind.strength
                    });
                    cam.stepped = false;
                    cam.landed = 0;
                }

                // What the ground is made of here, from the map's layer weights:
                // needles and leaves, trail, gravel, rock, or the meadow's grass
                function surfaceAt(x, z) {
                    var m = world.map;
                    if (!m.splatData) {
                        m.splatData = m.bytes(m.splat);
                    }
                    var n = m.splatSize;
                    var i = Math.floor((x + m.size / 2) / m.size * n);
                    var j = Math.floor((z + m.size / 2) / m.size * n);
                    i = Math.max(0, Math.min(n - 1, i));
                    j = Math.max(0, Math.min(n - 1, j));
                    var o = (j * n + i) * 4, d = m.splatData;
                    var w = [d[o], d[o + 1], d[o + 2], d[o + 3]];
                    var grass = 255 - w[0] - w[1] - w[2] - w[3];
                    // The shore is sand and pebbles whatever the layers say
                    if (vl.phys.terrain.heightAt(x, z) < world.map.water + 1.2) {
                        return "gravel";
                    }
                    var names = ["leaves", "dirt", "gravel", "stone"];
                    var best = "grass", most = grass;
                    for (var k = 0; k < 4; k++) {
                        if (w[k] > most) {
                            most = w[k];
                            best = names[k];
                        }
                    }
                    return best;
                }

                // Browsers only allow sound after a click or a key
                function wake() {
                    if (window.ValleySound) {
                        ValleySound.start();
                    }
                }
                vl.canvas.addEventListener("mousedown", wake);
                window.addEventListener("keydown", wake);

                // Numbers in the corner
                var fps = { frames: 0, time: 0, value: 0, ms: 0 };
                function showStats(app, dt) {
                    fps.frames++;
                    fps.time += dt;
                    if (fps.time < 0.5) {
                        return;
                    }
                    fps.value = fps.frames / fps.time;
                    fps.ms = fps.time / fps.frames * 1000;
                    fps.frames = 0;
                    fps.time = 0;
                    if (!vl.showStats) {
                        return;
                    }
                    var s = app.stats;
                    vl.statsEl.textContent =
                        fps.value.toFixed(0) + " fps · " + fps.ms.toFixed(1) + " ms (cpu " + (s.cpuMs || 0).toFixed(1) + ")\n" +
                        (s.instances || 0) + " of " + world.placed + " objects drawn · " + (s.drawCalls || 0) + " draws\n" +
                        ((s.triangles || 0) / 1e6).toFixed(2) + " M triangles · " + (s.grassBlades || 0) + " grass blades\n" +
                        "x " + cam.x.toFixed(0) + "  z " + cam.z.toFixed(0) + "  height " + cam.eyeY.toFixed(1) + " m";
                }

                var names = {
                    "valley-map": "the valley",
                    "valley-trees": "the forest",
                    "valley-nature": "rocks and plants",
                    "valley-props": "the camp and the fort"
                };
                var shares = [0.06, 0.4, 0.72, 0.9];

                vl.progress("downloading the valley (about 28 MB)…", 0.02);

                Axion.App.create(vl.canvas, {
                    maxDpr: 1,
                    fov: 70,
                    near: 0.1,
                    cameraPosition: [0, 60, 300],
                    cameraTarget: [0, 20, 0],
                    clearColor: [0.5, 0.6, 0.75, 1],
                    exposure: 1,
                    sun: {
                        elevation: 20,
                        azimuth: 160,
                        intensity: 3.4,
                        shadows: { size: 2048, distance: 230, split: 0.8, reach: 300 }
                    },
                    sky: {
                        clouds: 0.42,
                        haze: 0.9,
                        cloudShadows: 0.3,
                        cloudSpeed: 1,
                        ambientStrength: 1
                    },
                    wind: { direction: [0.8, 0.6], strength: 0.8, speed: 1 },
                    fogDensity: 0.0006,
                    fogHeight: { base: 0, falloff: 0.009 },
                    aerialPerspective: 1,
                    ambient: [0.1, 0.12, 0.15],
                    groundAmbient: 0.4,
                    lodBias: 1,
                    ao: { intensity: 1, radius: 1.3, fadeDistance: 45 },
                    ssr: { intensity: 1, steps: 48, maxDistance: 1500, fadeDistance: 700, thickness: 1 },
                    ssil: { intensity: 0 },
                    bloom: { strength: 0.16, threshold: 1.8 },
                    shadows: { maxLights: 2, size: 512 },
                    volumetric: {
                        enabled: true, density: 0.0016, maxDistance: 90, heightFalloff: 0.02,
                        anisotropy: 0.55, lightScatter: 0.8, ambient: 0.4, steps: 24
                    },
                    tonemap: { mode: "aces", contrast: 1.05, saturation: 1.05 },
                    autoExposure: { enabled: false }
                }).then(function (app) {
                    vl.app = app;
                    return vl.loadPacks(function (name, i) {
                        vl.progress("building " + names[name] + "…", shares[i]);
                        var entry = window.AxionAssets[name];

                        if (name === "valley-map") {
                            return Axion.unpackAsset(entry).then(function (buf) {
                                var map = world.map = readMap(buf);
                                vl.mapHalf = map.size / 2;
                                return buildTerrain(app, map);
                            }).then(function (terrain) {
                                vl.phys.terrain = terrain;
                                vl.phys.water = world.map.water;
                                vl.progress("downloading the forest…", shares[1] - 0.04);
                            });
                        }

                        return Axion.loadModels(app, entry, { maxTextureSize: 1024 }).then(function (res) {
                            placeModels(app, res.models);
                            if (i + 1 < vl.packs.length) {
                                vl.progress("downloading " + names[vl.packs[i + 1].name] + "…", shares[i] + 0.02);
                            }
                        });
                    });
                }).then(function () {
                    var app = vl.app;
                    vl.progress("finishing…", 0.96);

                    addLights(app);
                    vl.phys.index();
                    vl.applyPreset(app, "high");

                    // Start at the camp by the lake, standing on the ground
                    world.toSpawn();

                    app.onFrame(function (dt) {
                        moveSun(dt);
                        flicker(app);
                        listen(app, dt);
                        vl.moveCam(app, dt);
                        showStats(app, dt);
                    });

                    vl.buildMenu(app, world);
                    vl.ready = true;
                    vl.hint();
                    // Opened in its own tab meanwhile: this copy waits until that tab closes
                    if (!vl.full.tab || vl.full.tab.closed) {
                        app.start();
                    }

                    // Ready: wait on the loading screen for a click on Play
                    vl.progress("Ready", 1);
                    var play = document.getElementById("loadPlay");
                    play.style.display = "block";
                    play.onclick = function () {
                        document.getElementById("load").className = "done";
                        if (window.ValleySound) {
                            ValleySound.start();
                        }
                        // In the tab of its own, Play also goes fullscreen
                        if (vl.full.popped && vl.full.enter) {
                            vl.full.enter(function () {});
                        }
                        var req = vl.canvas.requestPointerLock ? vl.canvas.requestPointerLock() : null;
                        if (req && req.catch) {
                            req.catch(function () {});
                        }
                    };
                }).catch(function (e) {
                    vl.progress("Error: " + (e && e.message ? e.message : e));
                });
            })();
        </script>
    </body>
</html>
