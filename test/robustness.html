<!doctype html><meta charset="utf-8">
<!-- Two failure modes Colin saw on real hardware:
     1. black rectangle: one non-finite HDR pixel smeared by the bloom pyramid
     2. shadows blinking: large casters dropped whenever a light entered their bounding sphere -->
<canvas id="c" width="320" height="200" style="width:320px;height:200px"></canvas>
<script type="module">
import * as AX from '../src/index.js';
const out = { ok: false, errors: [], measured: {} };
window.__result = out;
const half=(h)=>{const e=(h>>10)&31,f=h&1023; if(e===31) return NaN;
  return (h&0x8000?-1:1)*(e?Math.pow(2,e-15)*(1+f/1024):Math.pow(2,-14)*(f/1024));};
async function nonFinite(gpu, tex) {
  const w = tex.width, h = tex.height, bpr = Math.ceil(w*8/256)*256;
  const buf = gpu.device.createBuffer({ size: bpr*h, usage: GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ });
  const e = gpu.device.createCommandEncoder();
  e.copyTextureToBuffer({ texture: tex }, { buffer: buf, bytesPerRow: bpr }, [w, h, 1]);
  gpu.device.queue.submit([e.finish()]); await buf.mapAsync(GPUMapMode.READ);
  const raw = new Uint16Array(buf.getMappedRange()); let bad = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const o = (y*bpr)/2 + x*4;
    if (!isFinite(half(raw[o]) + half(raw[o+1]) + half(raw[o+2]))) bad++;
  }
  buf.unmap(); buf.destroy(); return bad;
}
try {
  const canvas = document.getElementById('c');
  const gpu = await AX.createDevice(canvas);
  const app = new AX.App(canvas, gpu, { controls: false, shadows: { maxLights: 2, size: 256 } });
  app.camera.aspect = canvas.width / canvas.height;
  app.camera.position.set([0, 1, 9]); app.camera.target.set([0, 0, 0]); app.camera.update();

  // 1. A poisoned material: NaN colour and an Inf emissive.
  const box = app.mesh(AX.box(1, 1, 1));
  const bad = app.material({ color: [NaN, 1, 1], emissive: Infinity, metallic: 0, roughness: 0.5 });
  const ok = app.material({ color: [0.6, 0.6, 0.6], metallic: 0, roughness: 0.6 });
  app.add({ mesh: box, material: bad, position: [0, 0, 0] });
  app.light([2, 2, 3], { intensity: 40, range: 20 });
  app.renderer.render(app.world, app.camera, 0);
  await gpu.device.queue.onSubmittedWorkDone();
  const t = app.renderer._targets;
  out.measured.hdrNonFinite = await nonFinite(gpu, t.hdr);
  out.measured.bloomNonFinite = await nonFinite(gpu, t.bloom[0].tex);
  if (out.measured.hdrNonFinite) out.errors.push(`hdr has ${out.measured.hdrNonFinite} non-finite pixels`);
  if (out.measured.bloomNonFinite) out.errors.push(`bloom has ${out.measured.bloomNonFinite} non-finite texels (black rectangle)`);

  // 2. A light inside a big wall's bounding sphere must still be shadowed by it.
  const app2 = new AX.App(canvas, gpu, { controls: false, shadows: { maxLights: 2, size: 256 } });
  app2.add({ mesh: app2.mesh(AX.box(20, 20, 0.5)), material: app2.material({ color: [0.5, 0.5, 0.5] }), position: [0, 0, 0] });
  app2.light([0, 0, 2], { intensity: 40, range: 30 });
  app2.camera.aspect = canvas.width / canvas.height;
  app2.camera.position.set([0, 0, 12]); app2.camera.target.set([0, 0, 0]); app2.camera.update();
  app2.renderer.render(app2.world, app2.camera, 0);
  await gpu.device.queue.onSubmittedWorkDone();
  out.measured.wallCasters = app2.renderer.stats.shadowCasters;
  if (!(out.measured.wallCasters >= 1)) out.errors.push('large wall dropped from the shadow pass while the light is inside its bounds');

  out.ok = out.errors.length === 0;
} catch (e) { out.errors.push(String(e.stack || e)); }
out.done = true;
</script>
