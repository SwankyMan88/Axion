<!doctype html><meta charset="utf-8">
<canvas id="c" style="width:640px;height:360px"></canvas>
<script type="module">
import * as AX from '../src/index.js';
const out = { ok: false, steps: [], errors: [] };
window.__result = out;
try {
  const canvas = document.getElementById('c');
  const gpu = await AX.createDevice(canvas);
  gpu.device.addEventListener('uncapturederror', (e) => out.errors.push(e.error.message));
  const app = new AX.App(canvas, gpu, {
    maxDpr: 1, thumbnail: false, fov: 65,
    sun: { elevation: 22, azimuth: 200, intensity: 3.2 },
    sky: { clouds: 0.5, haze: 1.4 },
    ao: { intensity: 0.8, radius: 1.2 },
    fogDensity: 0.0015, aerialPerspective: 1,
    bloom: { strength: 0.2, threshold: 1.5 },
    volumetric: { enabled: true, density: 0.004, maxDistance: 80, heightFalloff: 0.05 },
    cameraPosition: [0, 30, 120], cameraTarget: [0, 10, 0],
  });
  out.steps.push('app');

  // A small valley: hills around, a lake in the middle.
  const n = 257, size = 512;
  const h = new Float32Array(n * n);
  const rnd = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
  const vnoise = (x, z) => {
    const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
    const u = fx * fx * (3 - 2 * fx), w = fz * fz * (3 - 2 * fz);
    const a = rnd(ix, iz), b = rnd(ix + 1, iz), c = rnd(ix, iz + 1), d = rnd(ix + 1, iz + 1);
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  };
  for (let z = 0; z < n; z++) {
    for (let x = 0; x < n; x++) {
      const wx = x / (n - 1) * size - size / 2, wz = z / (n - 1) * size - size / 2;
      let v = 0, amp = 1, f = 0.01;
      for (let o = 0; o < 5; o++) { v += vnoise(wx * f, wz * f) * amp; amp *= 0.5; f *= 2; }
      const r = Math.hypot(wx, wz) / (size / 2);
      h[z * n + x] = v * 18 + r * r * 60 - 8;
    }
  }
  const splat = new Uint8Array(64 * 64 * 4);
  for (let i = 0; i < 64 * 64; i++) { splat[i * 4] = (i * 7919) % 97 > 60 ? 200 : 0; }
  const img = (color) => { const c = new OffscreenCanvas(64, 64); const g = c.getContext('2d'); g.fillStyle = color; g.fillRect(0, 0, 64, 64); for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.3})`; g.fillRect(Math.random() * 64, Math.random() * 64, 3, 3); } return c; };
  const terrain = app.terrain({
    heights: h, size, grid: 32,
    layers: [
      { albedo: img('rgb(96, 110, 60)'), scale: 3 },
      { albedo: img('rgb(80, 66, 45)'), scale: 3 },
      { albedo: img('rgb(120, 118, 110)'), scale: 6, triplanar: true },
      { albedo: img('rgb(160, 145, 110)'), scale: 3 },
    ],
    splat: { data: splat, size: 64 },
    rock: { layer: 2, slope: [0.3, 0.5] },
    shore: { layer: 3, height: 1.5 },
    water: { level: 0 },
    grass: { radius: 40, height: 0.5, bladesPerTile: 256 },
  });
  out.steps.push('terrain ' + terrain.heightAt(0, 0).toFixed(2));

  // Trees: three LOD levels from primitives.
  const trunkMat = app.material({ color: [0.3, 0.2, 0.12], roughness: 0.9 });
  const leafMat = app.material({ color: [0.12, 0.3, 0.1], roughness: 0.8, wind: 0.5, translucency: 0.4 });
  const cone = (seg) => AX.sphere(2.2, seg, Math.max(3, seg >> 1));
  const leaves = app.lod([{ mesh: app.mesh(cone(16)), distance: 0 }, { mesh: app.mesh(cone(8)), distance: 40 }, { mesh: app.mesh(cone(4)), distance: 120 }], { drawDistance: 300 });
  const trunk = app.lod([{ mesh: app.mesh(AX.box(0.5, 4, 0.5)), distance: 0 }, { mesh: -1, distance: 120 }], { drawDistance: 300 });
  const model = { parts: [{ mesh: trunk, material: trunkMat }, { mesh: leaves, material: leafMat }] };
  const list = [];
  for (let i = 0; i < 1500; i++) {
    const x = (rnd(i, 1) - 0.5) * 480, z = (rnd(i, 2) - 0.5) * 480;
    const y = terrain.heightAt(x, z);
    if (y < 1) continue;
    list.push(x, y + 2, z, rnd(i, 3) * 6.28, 0.8 + rnd(i, 4) * 0.6);
  }
  const placed = app.place(model, list);
  out.steps.push('trees ' + placed);
  app.light([0, 3, 40], { color: [1, 0.6, 0.3], intensity: 60, range: 20 });

  for (let i = 0; i < 3; i++) {
    app.renderer.render(app.world, app.camera, i * 0.1);
    await gpu.device.queue.onSubmittedWorkDone();
  }
  out.stats = { ...app.stats };
  out.steps.push('rendered');
  await new Promise((r) => setTimeout(r, 50));
  out.ok = out.errors.length === 0;
} catch (e) {
  out.errors.push(String(e.stack || e));
}
out.done = true;
</script>
